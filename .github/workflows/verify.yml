# PRs test the proposed merge, using one conservative selector shared with local
# work. Main/manual runs retain complete coverage. Never skip this whole workflow.
name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  shards:
    name: test selection
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node dev/ci-plan.mjs

  node:
    name: node gate + goldens
    needs: shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Documentation checks
        if: needs.shards.outputs.mode == 'docs'
        run: node --test dev/docs.test.mjs dev/dsl-doc.test.mjs
      - name: Pure-module test gate
        if: needs.shards.outputs.mode != 'docs'
        env:
          PERF_SCALE: 3
        # perf.test measures wall time, so correctness tests remain serial for now.
        run: npm run test:node
      - name: Golden SVG regression
        if: needs.shards.outputs.mode != 'docs'
        run: node dev/golden.mjs verify

  browser:
    name: ${{ matrix.shard.name }}
    needs: shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}
    steps:
      - name: Explicit empty selection
        if: matrix.shard.suites == ''
        run: echo 'The selector requires no browser checks for these changes.'
      - uses: actions/checkout@v4
        if: matrix.shard.suites != ''
      - uses: actions/setup-node@v4
        if: matrix.shard.suites != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dev/pw/package-lock.json
      - name: Install harness deps
        if: matrix.shard.suites != ''
        working-directory: dev/pw
        run: npm ci
      - name: Cache Playwright browsers
        if: matrix.shard.suites != ''
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.shard.cachekey }}-${{ hashFiles('dev/pw/package-lock.json') }}
      - name: Install Playwright browsers
        if: matrix.shard.suites != ''
        working-directory: dev/pw
        env:
          BROWSERS: ${{ matrix.shard.browsers }}
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = 'true' ]; then
            npx playwright install-deps $BROWSERS
          else
            npx playwright install --with-deps $BROWSERS
          fi
      - name: Run selected browser journeys
        id: journeys
        if: matrix.shard.suites != ''
        env:
          SUITES: ${{ matrix.shard.suites }}
          TOOLS: ${{ matrix.shard.tools }}
        run: |
          args=(--browser-only --jobs 1 --suites "$SUITES")
          if [ -n "$TOOLS" ]; then args+=(--tools "$TOOLS"); fi
          node dev/pw/run.mjs "${args[@]}"

      - name: Preserve failed-run evidence
        if: failure() && steps.journeys.outputs.evidence != ''
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.shard.name }}
          path: ${{ steps.journeys.outputs.evidence }}
          retention-days: 7

  verified:
    name: verified
    if: always()
    needs: [shards, node, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every planned job to succeed
        env:
          SELECTION: ${{ needs.shards.result }}
          NODE: ${{ needs.node.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$SELECTION" = success && test "$NODE" = success && test "$BROWSER" = success
