<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="828" viewBox="0 0 1100 828" role="img" aria-label="Morrow / Paid tier" font-family="DM Sans"><rect width="1100" height="828" fill="#F6F3ED"/><text x="28" y="35" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">Morrow / Paid tier / ALTERNATIVES</text><text x="28" y="125" font-family="Instrument Serif" font-weight="400" font-size="64" fill="#171914">Launch the paid tier now, learn first, or defer?</text><rect x="28" y="165" width="1044" height="53" fill="#eae9e3"/><text x="44" y="197" font-family="DM Sans" font-weight="600" font-size="16" fill="#171914">Pilot approved · 2026-09-05</text><text x="257" y="196" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">Paid-tier launch remains undecided</text><text x="195" y="278" font-family="Instrument Serif" font-weight="400" font-size="30" fill="#171914">Run the pilot</text><text x="487.3333333333333" y="278" font-family="Instrument Serif" font-weight="400" font-size="30" fill="#171914">Launch now</text><text x="779.6666666666666" y="278" font-family="Instrument Serif" font-weight="400" font-size="30" fill="#171914">Defer this quarter</text><line x1="28" y1="309" x2="1072" y2="309" stroke="#c9c7c2"/><text x="28" y="343" font-family="DM Sans" font-weight="400" font-size="14" fill="#686B65">Expected value</text><text x="28" y="361" font-family="DM Sans" font-weight="400" font-size="14" fill="#686B65">/ outcome</text><text x="195" y="351" font-family="DM Sans" font-weight="600" font-size="22" fill="#171914">£16.6k expected contribution under the</text><text x="195" y="380" font-family="DM Sans" font-weight="600" font-size="22" fill="#171914">authored model</text><text x="487.3333333333333" y="351" font-family="DM Sans" font-weight="600" font-size="22" fill="#171914">£13k expected contribution under the</text><text x="487.3333333333333" y="380" font-family="DM Sans" font-weight="600" font-size="22" fill="#171914">same prior</text><text x="779.6666666666666" y="351" font-family="DM Sans" font-weight="600" font-size="22" fill="#171914">£0 incremental contribution, the</text><text x="779.6666666666666" y="380" font-family="DM Sans" font-weight="600" font-size="22" fill="#171914">model baseline</text><line x1="28" y1="409" x2="1072" y2="409" stroke="#c9c7c2"/><text x="28" y="443" font-family="DM Sans" font-weight="400" font-size="14" fill="#686B65">What must be true</text><text x="195" y="445" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">£10k total pilot cost; an informative</text><text x="195" y="466" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">signal; eight weeks of learning</text><text x="487.3333333333333" y="445" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Willingness to commit before learning</text><text x="487.3333333333333" y="466" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">about paid demand</text><text x="779.6666666666666" y="445" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Accepting the opportunity cost</text><text x="779.6666666666666" y="466" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">of waiting</text><line x1="28" y1="493" x2="1072" y2="493" stroke="#c9c7c2"/><text x="28" y="527" font-family="DM Sans" font-weight="400" font-size="14" fill="#686B65">Main downside</text><text x="195" y="529" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Delay reduces the viable-launch payoff</text><text x="195" y="550" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">from £160k to £140k.</text><text x="487.3333333333333" y="529" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Weak demand costs £50k in the model.</text><text x="779.6666666666666" y="529" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">No new learning about willingness</text><text x="779.6666666666666" y="550" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">to pay.</text><line x1="28" y1="577" x2="1072" y2="577" stroke="#c9c7c2"/><text x="28" y="611" font-family="DM Sans" font-weight="400" font-size="14" fill="#686B65">What changes</text><text x="28" y="629" font-family="DM Sans" font-weight="400" font-size="14" fill="#686B65">the choice</text><text x="195" y="613" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">At total cost above £13.6k, launch now</text><text x="195" y="634" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">leads in this model.</text><text x="487.3333333333333" y="613" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Becomes the model leader when the</text><text x="487.3333333333333" y="634" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">pilot loses its £3.6k advantage.</text><text x="779.6666666666666" y="613" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Prefer if constraints rule out both</text><text x="779.6666666666666" y="634" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">launch and a useful pilot.</text><line x1="28" y1="661" x2="1072" y2="661" stroke="#c9c7c2"/><line x1="28" y1="713" x2="1072" y2="713" stroke="#c9c7c2"/><text x="28" y="744" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">NON-NEGOTIABLE</text><text x="28" y="775" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Pilot approval does not authorise a general launch. Reconfirm budget before recruitment.</text></svg>