<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-case-deck="" data-page="5" role="img"><title>Morrow / Paid tier — Alternatives</title><rect width="1600" height="900" fill="#F6F3ED"/><text x="72" y="76" font-family="DM Sans" font-size="16" font-weight="600" fill="#526F65">CASE / ALTERNATIVES</text><line x1="72" y1="126" x2="1528" y2="126" stroke="#c9c7c2"/><line x1="72" y1="460" x2="1528" y2="460" stroke="#c9c7c2"/><g data-source-field="option.0.label"><text x="72" y="176" font-family="Instrument Serif" font-size="34" font-weight="400" fill="#171914">Run the pilot</text></g><g data-source-field="option.0.value.label"><text x="484" y="157" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">VALUE</text></g><g data-source-field="option.0.value"><text x="484" y="191" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">£16.6k expected contribution under the authored model</text></g><g data-source-field="option.0.requires.label"><text x="484" y="234" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">REQUIRES</text></g><g data-source-field="option.0.requires"><text x="484" y="268" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">£10k total pilot cost; an informative signal; eight weeks of learning</text></g><g data-source-field="option.0.downside.label"><text x="484" y="311" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">DOWNSIDE</text></g><g data-source-field="option.0.downside"><text x="484" y="345" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Delay reduces the viable-launch payoff from £160k to £140k.</text></g><g data-source-field="option.0.reconsider.label"><text x="484" y="388" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">RECONSIDER WHEN</text></g><g data-source-field="option.0.reconsider"><text x="484" y="422" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">At total cost above £13.6k, launch now leads in this model.</text></g><g data-source-field="option.1.label"><text x="72" y="510" font-family="Instrument Serif" font-size="34" font-weight="400" fill="#171914">Launch now</text></g><g data-source-field="option.1.value.label"><text x="484" y="491" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">VALUE</text></g><g data-source-field="option.1.value"><text x="484" y="525" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">£13k expected contribution under the same prior</text></g><g data-source-field="option.1.requires.label"><text x="484" y="568" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">REQUIRES</text></g><g data-source-field="option.1.requires"><text x="484" y="602" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Willingness to commit before learning about paid demand</text></g><g data-source-field="option.1.downside.label"><text x="484" y="645" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">DOWNSIDE</text></g><g data-source-field="option.1.downside"><text x="484" y="679" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Weak demand costs £50k in the model.</text></g><g data-source-field="option.1.reconsider.label"><text x="484" y="722" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">RECONSIDER WHEN</text></g><g data-source-field="option.1.reconsider"><text x="484" y="756" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Becomes the model leader when the pilot loses its £3.6k advantage.</text></g><line x1="72" y1="833" x2="1528" y2="833" stroke="#c9c7c2"/><text x="72" y="864" font-family="DM Sans" font-size="16" fill="#686B65">Morrow / Paid tier</text><text x="1528" y="864" text-anchor="end" font-family="DM Sans" font-size="16" fill="#686B65">5 / 6</text></svg>