<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-case-deck="" data-page="5" role="img"><title>Morrow / Paid tier — Alternatives</title><rect width="1600" height="900" fill="#F6F3ED"/><text x="72" y="76" font-family="DM Sans" font-size="16" font-weight="600" fill="#526F65">CASE / ALTERNATIVES</text><line x1="552" y1="142" x2="552" y2="794" stroke="#c9c7c2"/><line x1="1048" y1="142" x2="1048" y2="794" stroke="#c9c7c2"/><g data-source-field="option.0.label"><text x="72" y="176" font-family="Instrument Serif" font-size="34" font-weight="400" fill="#171914">Run the pilot</text></g><g data-source-field="option.0.value.label"><text x="72" y="222" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">VALUE</text></g><g data-source-field="option.0.value"><text x="72" y="256" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">£16.6k expected contribution under the authored model</text></g><g data-source-field="option.0.requires.label"><text x="72" y="299" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">REQUIRES</text></g><g data-source-field="option.0.requires"><text x="72" y="333" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">£10k total pilot cost; an informative signal; eight weeks of</text><text x="72" y="365" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">learning</text></g><g data-source-field="option.0.downside.label"><text x="72" y="408" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">DOWNSIDE</text></g><g data-source-field="option.0.downside"><text x="72" y="442" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Delay reduces the viable-launch payoff from £160k to £140k.</text></g><g data-source-field="option.0.reconsider.label"><text x="72" y="485" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">RECONSIDER WHEN</text></g><g data-source-field="option.0.reconsider"><text x="72" y="519" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">At total cost above £13.6k, launch now leads in this model.</text></g><g data-source-field="option.1.label"><text x="568" y="176" font-family="Instrument Serif" font-size="34" font-weight="400" fill="#171914">Launch now</text></g><g data-source-field="option.1.value.label"><text x="568" y="222" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">VALUE</text></g><g data-source-field="option.1.value"><text x="568" y="256" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">£13k expected contribution under the same prior</text></g><g data-source-field="option.1.requires.label"><text x="568" y="299" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">REQUIRES</text></g><g data-source-field="option.1.requires"><text x="568" y="333" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Willingness to commit before learning about paid demand</text></g><g data-source-field="option.1.downside.label"><text x="568" y="376" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">DOWNSIDE</text></g><g data-source-field="option.1.downside"><text x="568" y="410" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Weak demand costs £50k in the model.</text></g><g data-source-field="option.1.reconsider.label"><text x="568" y="453" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">RECONSIDER WHEN</text></g><g data-source-field="option.1.reconsider"><text x="568" y="487" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Becomes the model leader when the pilot loses its £3.6k advantage.</text></g><g data-source-field="option.2.label"><text x="1064" y="176" font-family="Instrument Serif" font-size="34" font-weight="400" fill="#171914">Defer this quarter</text></g><g data-source-field="option.2.value.label"><text x="1064" y="222" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">VALUE</text></g><g data-source-field="option.2.value"><text x="1064" y="256" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">£0 incremental contribution, the model baseline</text></g><g data-source-field="option.2.requires.label"><text x="1064" y="299" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">REQUIRES</text></g><g data-source-field="option.2.requires"><text x="1064" y="333" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Accepting the opportunity cost of waiting</text></g><g data-source-field="option.2.downside.label"><text x="1064" y="376" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">DOWNSIDE</text></g><g data-source-field="option.2.downside"><text x="1064" y="410" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">No new learning about willingness to pay.</text></g><g data-source-field="option.2.reconsider.label"><text x="1064" y="453" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">RECONSIDER WHEN</text></g><g data-source-field="option.2.reconsider"><text x="1064" y="487" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Prefer if constraints rule out both launch and a useful pilot.</text></g><line x1="72" y1="833" x2="1528" y2="833" stroke="#c9c7c2"/><text x="72" y="864" font-family="DM Sans" font-size="16" fill="#686B65">Morrow / Paid tier</text><text x="1528" y="864" text-anchor="end" font-family="DM Sans" font-size="16" fill="#686B65">5 / 5</text></svg>