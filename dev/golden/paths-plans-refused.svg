<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="315" viewBox="0 0 1160 315" data-theme="light" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="paths-plans-name paths-plans-description"><title id="paths-plans-name">Seven-question boundary — possible plans</title><desc id="paths-plans-description">7 questions, 8 items, plans unavailable. Seven open questions would make 128 possible plans. Answer one, or use the Tree view. Use style: tree to see the decision paths.</desc><rect x="0" y="0" width="1160" height="315" fill="#f7f8f6"/><g data-kind="artifact-header"><text x="36" y="38" font-family="Charter,'Bitstream Charter',Georgia,serif" font-size="24" font-weight="700" fill="#222">Seven-question boundary</text><text x="1124" y="38" font-size="11" text-anchor="end" fill="#667">2026-08-11</text><line x1="36" y1="69" x2="1124" y2="69" stroke="#ddd" stroke-width="1" opacity="1"/></g><g data-kind="plans-refusal"><rect x="36" y="92" width="1088" height="116" fill="none" stroke="#ddd" stroke-width="1"/><line x1="36" y1="92" x2="36" y2="208" stroke="#08c" stroke-width="4" opacity="1"/><text x="58" y="114" font-size="9" font-weight="700" letter-spacing="1" fill="#667">POSSIBLE PLANS UNAVAILABLE</text><text x="58" y="142" font-family="Charter,'Bitstream Charter',Georgia,serif" font-size="21" font-weight="700" fill="#222">Seven open questions would make 128 possible plans. Answer one, or use the Tree view.</text><text x="58" y="190" font-size="10" font-weight="600" fill="#667">Use style: tree to see the decision paths.</text></g><g data-kind="artifact-verdict"><text xml:space="preserve" x="36" y="232" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="500" letter-spacing="1.8" fill="#667">VERDICT</text><text xml:space="preserve" x="36" y="262" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" letter-spacing="-0.33" fill="#222"><tspan class="vfig" fill="#D62015">One of eight</tspan> items depends on the q0 answer, due 10 September.</text></g></svg>