<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1050" viewBox="0 0 1100 1050" role="img" aria-label="Morrow / Paid tier" font-family="DM Sans"><rect width="1100" height="1050" fill="#F6F3ED"/><text x="28" y="35" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">Morrow / Paid tier / DECISION REVIEW</text><text x="28" y="125" font-family="Instrument Serif" font-weight="400" font-size="64" fill="#171914">Fund the pilot. Keep launch open.</text><text x="28" y="182" font-family="DM Sans" font-weight="400" font-size="17" fill="#686B65">Launch the paid tier now, learn first, or defer?</text><rect x="28" y="211" width="1044" height="53" fill="#eae9e3"/><text x="44" y="243" font-family="DM Sans" font-weight="600" font-size="16" fill="#171914">Pilot approved · 2026-09-05</text><text x="257" y="242" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">Paid-tier launch remains undecided</text><text x="28" y="305" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">REASONS &amp; BASIS</text><line x1="28" y1="323" x2="1072" y2="323" stroke="#c9c7c2"/><text x="40" y="351" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">MODEL / TREE</text><text x="40" y="395" font-family="Instrument Serif" font-weight="400" font-size="32" fill="#171914">The pilot has a £3.6k decision margin</text><text x="40" y="430" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Tree values the pilot at £16.6k versus £13k for launch now, including the £10k pilot cost.</text><text x="827" y="376" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">Expected value compares authored</text><text x="827" y="396" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">possibilities; it is not a</text><text x="827" y="416" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">promise of revenue.</text><line x1="28" y1="460" x2="1072" y2="460" stroke="#c9c7c2"/><text x="40" y="488" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">MODEL / FERMI</text><text x="40" y="532" font-family="Instrument Serif" font-weight="400" font-size="32" fill="#171914">Contribution depends on paid demand</text><text x="40" y="567" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Fermi makes the conditional payoff assumptions inspectable before they enter the decision tree.</text><text x="827" y="513" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">Payoff variants are not</text><text x="827" y="533" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">probabilities. Fixed inputs can</text><text x="827" y="553" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">produce 100% of simulations</text><text x="827" y="573" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">without establishing</text><text x="827" y="593" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">real-world certainty.</text><line x1="28" y1="631" x2="1072" y2="631" stroke="#c9c7c2"/><text x="40" y="659" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">JUDGEMENT / PATHS</text><text x="40" y="703" font-family="Instrument Serif" font-weight="400" font-size="32" fill="#171914">Launch needs a recorded answer</text><text x="40" y="738" font-family="DM Sans" font-weight="400" font-size="16" fill="#171914">Paths keeps both launch and defer available until the pilot answer is recorded.</text><text x="827" y="684" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">This approval funds learning; it</text><text x="827" y="704" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">does not approve</text><text x="827" y="724" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">paid-tier rollout.</text><line x1="28" y1="768" x2="1072" y2="768" stroke="#c9c7c2"/><text x="28" y="807" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">ALTERNATIVES</text><text x="28" y="843" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Run the pilot</text><text x="28" y="871" font-family="DM Sans" font-weight="500" font-size="16" fill="#526F65">£16.6k expected contribution under the</text><text x="28" y="892" font-family="DM Sans" font-weight="500" font-size="16" fill="#526F65">authored model</text><text x="376" y="843" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Launch now</text><text x="376" y="871" font-family="DM Sans" font-weight="500" font-size="16" fill="#526F65">£13k expected contribution under the</text><text x="376" y="892" font-family="DM Sans" font-weight="500" font-size="16" fill="#526F65">same prior</text><text x="724" y="843" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Defer this quarter</text><text x="724" y="871" font-family="DM Sans" font-weight="500" font-size="16" fill="#526F65">£0 incremental contribution, the</text><text x="724" y="892" font-family="DM Sans" font-weight="500" font-size="16" fill="#526F65">model baseline</text><line x1="28" y1="935" x2="1072" y2="935" stroke="#c9c7c2"/><text x="28" y="966" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">NON-NEGOTIABLE</text><text x="28" y="997" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Pilot approval does not authorise a general launch. Reconfirm budget before recruitment.</text></svg>