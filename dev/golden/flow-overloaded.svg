<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" role="img" aria-label="The average item takes 187 days — 3.9 days working, 183 days waiting.  Backlog growing ~0.9/week — demand exceeds capacity; no WIP limit fixes that."><rect width="860" height="470" fill="#fff"/><text x="26" y="46" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500" letter-spacing="1.8" fill="#667">VERDICT</text><text x="26" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.36" fill="#222">The average item takes <tspan fill="#D62015">187 days</tspan> — 3.9 days working, 183 days waiting.</text><text x="26" y="112" font-size="12.5" fill="#667">P85 293 days · P95 311 days · throughput 5.1/week vs demand 6/week · team busy 100%</text><text x="26" y="132" font-size="12.5" font-weight="600" fill="#b33">⚠ Backlog growing ~0.9/week — demand exceeds capacity; no WIP limit fixes that.</text><text x="26" y="152" font-size="12.5" fill="#667">WIP 4 keeps ≥95% of max throughput — beyond it you buy cycle time, not delivery.</text><text x="26" y="186" font-size="10" font-weight="600" letter-spacing="1" fill="#667">LEAD TIME, REQUEST → DONE (SIMULATED ITEMS)</text><rect x="134.7" y="285.6" width="24.9" height="16.4" rx="2" fill="#08c"/><rect x="161.7" y="200" width="24.9" height="102" rx="2" fill="#08c"/><rect x="188.6" y="252.1" width="24.9" height="49.9" rx="2" fill="#08c"/><rect x="215.5" y="274" width="24.9" height="28" rx="2" fill="#08c"/><rect x="242.5" y="282.2" width="24.9" height="19.8" rx="2" fill="#08c"/><rect x="269.4" y="274" width="24.9" height="28" rx="2" fill="#08c"/><rect x="296.3" y="276.6" width="24.9" height="25.4" rx="2" fill="#08c"/><rect x="323.3" y="273.6" width="24.9" height="28.4" rx="2" fill="#08c"/><rect x="350.2" y="258.5" wid