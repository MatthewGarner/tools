 font-weight="600" fill="#222">45</text></g><rect x='163.0' y='232' width='97.0' height='22' rx='0' fill='none'/><text x="173" y="247" font-size="12" font-weight="600" fill="#667">rte</text><g><text x="201" y="247" font-size="12" font-weight="600" fill="#222">86</text></g><text x="215" y="247" font-size="12" font-weight="600" fill="#667">..</text><g><text x="229" y="247" font-size="12" font-weight="600" fill="#222">90%</text></g><rect x='268.0' y='232' width='132.0' height='22' rx='0' fill='none'/><text x="278" y="247" font-size="12" font-weight="600" fill="#667">calendar</text><g><text x="341" y="247" font-size="12" font-weight="600" fill="#222">1</text></g><text x="348" y="247" font-size="12" font-weight="600" fill="#667">..</text><g><text x="362" y="247" font-size="12" font-weight="600" fill="#222">1.8%</text></g><g><rect x='408.0' y='232' width='251.0' height='22' rx='0' fill='none'/><text x="418" y="247" font-size="12" font-weight="600" fill="#667">binds: warranty 10/10 · wear 0/10</text></g><rect x='24' y='288' width='1152' height='172' rx='0' fill='#fff' stroke='#ddd'/><text x="44" y="314" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#667">THE SECOND CYCLE</text><rect x='300' y='328' width='171.3' height='30' fill='none'/><path d='M300 358 L306.7 358.0 L320.0 357.8 L333.3 357.0 L346.6 351.3 L359.9 343.1 L373.2 334.4 L386.5 332.2 L399.8 328.0 L413.2 330.7 L426.5 332.0 L439.8 331.2 L453.1 339.9 L466.4 343.1 L479.7 349.8 L493.0 349.1 L506.3 353.5 L519.7 354.0 L533.0 356.0 L546.3 356.5 L559.6 356.3 L572.9 357.8 L586.2 357.5 L599.5 357.0 L612.8 358.0 L626.2 358.0 L639.5 358.0 L652.8 358.0 L666.1 357.8 L679.4 358.0 L692.7 358.0 L706.0 358.0 L719.3 358.0 L732.7 358.0 L746.0 358.0 L759.3 358.0 L772.6 358.0 L785.9 358.0 L799.2 358.0 L812.5 358.0 L825.8 358.0 L839.2 358.0 L852.5 358.0 L865.8 358.0 L879.1 358.0 L892.4 358.0 L905.7 358.0 L919.0 358.0 L932.3 358.0 L945.7 358.0 L959.0 358.0 L972.3 358.0 L985.6 358.0 L998.9 358.0 L1012.2 358.0 L1025.5 358