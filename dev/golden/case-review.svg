<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1023" viewBox="0 0 1100 1023" role="img" aria-label="Morrow / Paid tier" font-family="DM Sans"><rect width="1100" height="1023" fill="#F6F3ED"/><text x="28" y="35" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">Morrow / Paid tier / REVIEW RECORD</text><text x="28" y="125" font-family="Instrument Serif" font-weight="400" font-size="64" fill="#171914">How the decision changed</text><text x="28" y="182" font-family="DM Sans" font-weight="400" font-size="17" fill="#686B65">Launch the paid tier now, learn first, or defer?</text><rect x="28" y="211" width="1044" height="53" fill="#eae9e3"/><text x="44" y="243" font-family="DM Sans" font-weight="600" font-size="16" fill="#171914">Pilot approved · 2026-09-05</text><text x="257" y="242" font-family="DM Sans" font-weight="400" font-size="15" fill="#686B65">Paid-tier launch remains undecided</text><line x1="28" y1="294" x2="1072" y2="294" stroke="#c9c7c2"/><text x="28" y="327" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">2026-09-12</text><text x="154" y="350" font-family="Instrument Serif" font-weight="400" font-size="34" fill="#171914">Pilot cost revised</text><text x="154" y="387" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">CHANGED</text><text x="154" y="415" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Total pilot cost increased from £10k to £14k. No new customer results were observed.</text><text x="154" y="449" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">IMPLICATION</text><text x="154" y="477" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Pilot expected value falls to £12.6k; launch now remains £13k and becomes the model leader.</text><text x="154" y="511" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">DECISION</text><text x="154" y="539" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Reopen the pilot approval. Reconfirm the cost or explicitly authorise a different route before spending.</text><text x="154" y="576" font-family="DM Sans" font-weight="400" font-size="14" fill="#526F65">Captured references available</text><line x1="28" y1="612" x2="1072" y2="612" stroke="#c9c7c2"/><text x="28" y="645" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">2026-11-13</text><text x="154" y="668" font-family="Instrument Serif" font-weight="400" font-size="34" fill="#171914">Planned pilot decision review</text><text x="154" y="705" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">CHANGED</text><text x="154" y="733" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Scheduled review; no pilot evidence has been recorded in this example.</text><text x="154" y="767" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">IMPLICATION</text><text x="154" y="795" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Launch remains open until evidence and its limitations are entered.</text><text x="154" y="829" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">DECISION</text><text x="154" y="857" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Keep the original authorisation distinct from the later rollout decision.</text><line x1="28" y1="908" x2="1072" y2="908" stroke="#c9c7c2"/><text x="28" y="939" font-family="DM Sans" font-weight="600" font-size="11" fill="#526F65" letter-spacing="1.4">NON-NEGOTIABLE</text><text x="28" y="970" font-family="DM Sans" font-weight="400" font-size="17" fill="#171914">Pilot approval does not authorise a general launch. Reconfirm budget before recruitment.</text></svg>