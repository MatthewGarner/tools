<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1251" viewBox="0 0 390 1251" role="img" aria-label="Morrow / Paid tier" font-family="DM Sans"><rect width="390" height="1251" fill="#171A18"/><text x="16" y="35" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">Morrow / Paid tier / REVIEW RECORD</text><text x="16" y="101" font-family="Instrument Serif" font-weight="400" font-size="40" fill="#F6F3ED">How the decision changed</text><text x="16" y="152" font-family="DM Sans" font-weight="400" font-size="17" fill="#B8BDB8">Launch the paid tier now, learn first, or defer?</text><rect x="16" y="181" width="358" height="81" fill="#222926"/><text x="32" y="213" font-family="DM Sans" font-weight="600" font-size="16" fill="#F6F3ED">Pilot approved · 2026-09-05</text><text x="32" y="241" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">Paid-tier launch remains undecided</text><line x1="16" y1="292" x2="374" y2="292" stroke="#444543"/><text x="16" y="325" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">2026-09-12</text><text x="16" y="375" font-family="Instrument Serif" font-weight="400" font-size="34" fill="#F6F3ED">Pilot cost revised</text><text x="16" y="412" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">CHANGED</text><text x="16" y="440" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Total pilot cost increased from £10k to £14k. No</text><text x="16" y="462" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">new customer results were observed.</text><text x="16" y="496" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">IMPLICATION</text><text x="16" y="524" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Pilot expected value falls to £12.6k; launch now</text><text x="16" y="546" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">remains £13k and becomes the model leader.</text><text x="16" y="580" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">DECISION</text><text x="16" y="608" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Reopen the pilot approval. Reconfirm the cost or</text><text x="16" y="630" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">explicitly authorise a different route</text><text x="16" y="652" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">before spending.</text><text x="16" y="689" font-family="DM Sans" font-weight="400" font-size="14" fill="#758c84">Captured references available</text><line x1="16" y1="725" x2="374" y2="725" stroke="#444543"/><text x="16" y="758" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">2026-11-13</text><text x="16" y="808" font-family="Instrument Serif" font-weight="400" font-size="34" fill="#F6F3ED">Planned pilot decision review</text><text x="16" y="845" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">CHANGED</text><text x="16" y="873" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Scheduled review; no pilot evidence has been</text><text x="16" y="895" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">recorded in this example.</text><text x="16" y="929" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">IMPLICATION</text><text x="16" y="957" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Launch remains open until evidence and its</text><text x="16" y="979" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">limitations are entered.</text><text x="16" y="1013" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">DECISION</text><text x="16" y="1041" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Keep the original authorisation distinct from the</text><text x="16" y="1063" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">later rollout decision.</text><line x1="16" y1="1114" x2="374" y2="1114" stroke="#444543"/><text x="16" y="1145" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">NON-NEGOTIABLE</text><text x="16" y="1176" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Pilot approval does not authorise a general launch.</text><text x="16" y="1198" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Reconfirm budget before recruitment.</text></svg>