"253.2" r="1.6" fill="#667"/><circle cx="469.7" cy="312.3" r="1.6" fill="#667"/><circle cx="618.3" cy="288.6" r="1.6" fill="#667"/><circle cx="766.9" cy="288.6" r="1.6" fill="#667"/><circle cx="915.4" cy="276.8" r="1.6" fill="#667"/><circle cx="1064" cy="253.2" r="1.6" fill="#667"/><polyline points="24,205.9 172.6,194.1 321.1,217.7 469.7,241.4 618.3,324.1 766.9,253.2 915.4,229.5 1064,205.9" fill="none" stroke="#667" stroke-width="1.1" opacity="0.5"/><circle cx="24" cy="205.9" r="1.6" fill="#667"/><circle cx="172.6" cy="194.1" r="1.6" fill="#667"/><circle cx="321.1" cy="217.7" r="1.6" fill="#667"/><circle cx="469.7" cy="241.4" r="1.6" fill="#667"/><circle cx="618.3" cy="324.1" r="1.6" fill="#667"/><circle cx="618.3" cy="324.1" r="5.5" fill="none" stroke="#08c" stroke-width="1.6"/><circle cx="766.9" cy="253.2" r="1.6" fill="#667"/><circle cx="915.4" cy="229.5" r="1.6" fill="#667"/><circle cx="1064" cy="205.9" r="1.6" fill="#667"/><text x="1064" y="374.5" font-size="10" font-weight="700" text-anchor="end" fill="#b33">Ben — the one real decline</text><text x="24" y="421" font-size="13" fill="#667">2 of your calls were single-point coin flips · 42 noise readings left alone · re-aiming the</text><text x="24" y="437" font-size="13" fill="#667">target to each quarter’s number would open a gap with about twice the variance (Deming’s</text><text x="24" y="453" font-size="13" fill="#667">funnel).</text><text x="24" y="475" font-size="14" font-weight="600" fill="#222">You only get this band in a simulation — your real team doesn’t come with one. What transfers</text><text x="24" y="492" font-size="14" font-weight="600" fill="#222">isn’t the band, it’s the question: spike, or shift?</text></svg>