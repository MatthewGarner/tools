<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1451" viewBox="0 0 390 1451" role="img" aria-label="Morrow / Paid tier" font-family="DM Sans"><rect width="390" height="1451" fill="#171A18"/><text x="16" y="35" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">Morrow / Paid tier / DECISION REVIEW</text><text x="16" y="101" font-family="Instrument Serif" font-weight="400" font-size="40" fill="#F6F3ED">Fund the pilot. Keep launch open.</text><text x="16" y="152" font-family="DM Sans" font-weight="400" font-size="17" fill="#B8BDB8">Launch the paid tier now, learn first, or defer?</text><rect x="16" y="181" width="358" height="81" fill="#222926"/><text x="32" y="213" font-family="DM Sans" font-weight="600" font-size="16" fill="#F6F3ED">Pilot approved · 2026-09-05</text><text x="32" y="241" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">Paid-tier launch remains undecided</text><text x="16" y="303" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">REASONS &amp; BASIS</text><line x1="16" y1="321" x2="374" y2="321" stroke="#444543"/><text x="28" y="349" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">MODEL / TREE</text><text x="28" y="390" font-family="Instrument Serif" font-weight="400" font-size="29" fill="#F6F3ED">The pilot has a £3.6k decision margin</text><text x="28" y="425" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Tree values the pilot at £16.6k versus £13k for</text><text x="28" y="446" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">launch now, including the £10k pilot cost.</text><text x="28" y="482" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">Expected value compares authored possibilities;</text><text x="28" y="502" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">it is not a promise of revenue.</text><line x1="16" y1="532" x2="374" y2="532" stroke="#444543"/><text x="28" y="560" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">MODEL / FERMI</text><text x="28" y="601" font-family="Instrument Serif" font-weight="400" font-size="29" fill="#F6F3ED">Contribution depends on paid demand</text><text x="28" y="636" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Fermi makes the conditional payoff assumptions</text><text x="28" y="657" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">inspectable before they enter the</text><text x="28" y="678" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">decision tree.</text><text x="28" y="714" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">Payoff variants are not probabilities. Fixed</text><text x="28" y="734" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">inputs can produce 100% of simulations without</text><text x="28" y="754" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">establishing real-world certainty.</text><line x1="16" y1="784" x2="374" y2="784" stroke="#444543"/><text x="28" y="812" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">JUDGEMENT / PATHS</text><text x="28" y="853" font-family="Instrument Serif" font-weight="400" font-size="29" fill="#F6F3ED">Launch needs a recorded answer</text><text x="28" y="888" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Paths keeps both launch and defer available</text><text x="28" y="909" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">until the pilot answer is recorded.</text><text x="28" y="945" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">This approval funds learning; it does not</text><text x="28" y="965" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">approve paid-tier rollout.</text><line x1="16" y1="995" x2="374" y2="995" stroke="#444543"/><text x="16" y="1034" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">ALTERNATIVES</text><text x="16" y="1070" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Run the pilot</text><text x="16" y="1098" font-family="DM Sans" font-weight="500" font-size="16" fill="#758c84">£16.6k expected contribution under the</text><text x="16" y="1119" font-family="DM Sans" font-weight="500" font-size="16" fill="#758c84">authored model</text><text x="16" y="1167" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Launch now</text><text x="16" y="1195" font-family="DM Sans" font-weight="500" font-size="16" fill="#758c84">£13k expected contribution under the same prior</text><text x="16" y="1243" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Defer this quarter</text><text x="16" y="1271" font-family="DM Sans" font-weight="500" font-size="16" fill="#758c84">£0 incremental contribution, the model baseline</text><line x1="16" y1="1314" x2="374" y2="1314" stroke="#444543"/><text x="16" y="1345" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">NON-NEGOTIABLE</text><text x="16" y="1376" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Pilot approval does not authorise a general launch.</text><text x="16" y="1398" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Reconfirm budget before recruitment.</text></svg>