<svg xmlns="http://www.w3.org/2000/svg" width="860" height="268" viewBox="0 0 860 268" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" role="img" aria-label="Expedited work averages 4.2 days; standard work averages 4.3 days. The lane uses the same people and WIP. The 0.2 days gap is waiting shifted onto standard work."><rect width="860" height="268" fill="#fff"/><text x="26" y="46" font-size="10" font-weight="600" letter-spacing="1" fill="#667">EXPEDITE LANE — THE COST OF &quot;JUST THIS ONCE&quot;</text><text x="26" y="76" font-size="19" fill="#222">Expedited work averages <tspan font-weight="700">4.2 days</tspan>; standard work averages <tspan font-weight="700">4.3 days</tspan>.</text><text x="26" y="100" font-size="12.5" font-weight="600" fill="#b33">The lane uses the same people and WIP. The 0.2 days gap is waiting shifted onto standard work.</text><text x="26" y="142" font-size="10" font-weight="600" letter-spacing="1" fill="#667">EXPEDITED</text><rect x="176" y="130" width="548" height="18" fill="#edf0ee"/><rect x="176" y="130" width="352.5" height="18" fill="#08c"/><line x1="690.3" y1="127" x2="690.3" y2="151" stroke="#222" stroke-width="1"/><text x="834" y="143" font-size="11.5" font-weight="600" text-anchor="end" fill="#222">4.2 days mean · P85 6.1 days</text><text x="26" y="190" font-size="10" font-weight="600" letter-spacing="1" fill="#667">STANDARD</text><rect x="176" y="178" width="548" height="18" fill="#edf0ee"/><rect x="176" y="178" width="365.8" height="18" fill="#b33"/><line x1="724" y1="175" x2="724" y2="199" stroke="#222" stroke-width="1"/><text x="834" y="191" font-size="11.5" font-weight="600" text-anchor="end" fill="#222">4.3 days mean · P85 6.5 days</text><text x="26" y="242" font-size="11.5" fill="#667">Priority arrival rate 1/week · total throughput 2.8/week</text></svg>