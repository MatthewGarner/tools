 cy="221.7" r="1.6" fill="#667"/><circle cx="154.9" cy="221.7" r="5.5" fill="none" stroke="#08c" stroke-width="1.6"/><circle cx="201.1" cy="285.4" r="1.6" fill="#667"/><circle cx="247.4" cy="247.2" r="1.6" fill="#667"/><circle cx="293.7" cy="285.4" r="1.6" fill="#667"/><circle cx="340" cy="279" r="1.6" fill="#667"/><polyline points="16,266.3 62.3,259.9 108.6,272.6 154.9,304.5 201.1,291.7 247.4,291.7 293.7,285.4 340,272.6" fill="none" stroke="#667" stroke-width="1.1" opacity="0.5"/><circle cx="16" cy="266.3" r="1.6" fill="#667"/><circle cx="62.3" cy="259.9" r="1.6" fill="#667"/><circle cx="108.6" cy="272.6" r="1.6" fill="#667"/><circle cx="154.9" cy="304.5" r="1.6" fill="#667"/><circle cx="201.1" cy="291.7" r="1.6" fill="#667"/><circle cx="247.4" cy="291.7" r="1.6" fill="#667"/><circle cx="293.7" cy="285.4" r="1.6" fill="#667"/><circle cx="340" cy="272.6" r="1.6" fill="#667"/><polyline points="16,247.2 62.3,240.8 108.6,253.5 154.9,266.3 201.1,310.8 247.4,272.6 293.7,259.9 340,247.2" fill="none" stroke="#667" stroke-width="1.1" opacity="0.5"/><circle cx="16" cy="247.2" r="1.6" fill="#667"/><circle cx="62.3" cy="240.8" r="1.6" fill="#667"/><circle cx="108.6" cy="253.5" r="1.6" fill="#667"/><circle cx="154.9" cy="266.3" r="1.6" fill="#667"/><circle cx="201.1" cy="310.8" r="1.6" fill="#667"/><circle cx="201.1" cy="310.8" r="5.5" fill="none" stroke="#08c" stroke-width="1.6"/><circle cx="247.4" cy="272.6" r="1.6" fill="#667"/><circle cx="293.7" cy="259.9" r="1.6" fill="#667"/><circle cx="340" cy="247.2" r="1.6" fill="#667"/><text x="340" y="344.9" font-size="10" font-weight="700" text-anchor="end" fill="#b33">Ben — the one real decline</text><text x="16" y="375" font-size="11.5" fill="#667">2 of your calls were single-point coin</text><text x="16" y="391" font-size="11.5" fill="#667">flips · 42 noise readings left alone ·</text><text x="16" y="407" font-size="11.5" fill="#667">re-aiming the target to each quarter’s</text><text x="16" y="423" font-size="11.5" fill="#667">number would open a gap with about twice</text><text x="16" y="439" font-size="11.5" fill="#667">the variance (Deming’s funnel).</text><text x="16" y="461" font-size="12.5" font-weight="600" fill="#222">You only get this band in a simulation —</text><text x="16" y="478" font-size="12.5" font-weight="600" fill="#222">your real team doesn’t come with one.</text><text x="16" y="495" font-size="12.5" font-weight="600" fill="#222">What transfers isn’t the band, it’s the</text><text x="16" y="512" font-size="12.5" font-weight="600" fill="#222">question: spike, or shift?</text></svg>