<svg xmlns="http://www.w3.org/2000/svg" width="356" height="539" viewBox="0 0 356 539" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="3 special-cause conversations. 2 chased noise — and you caught Ben’s real decline, late."><rect width="356" height="539" fill="#f7f8f6"/><text xml:space="preserve" x="16" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="500" letter-spacing="1.8" fill="#667">VERDICT</text><text xml:space="preserve" x="16" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" letter-spacing="-0.24" fill="#222"><tspan fill="#D62015">3</tspan> special-cause conversations.</text><text xml:space="preserve" x="16" y="85" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" letter-spacing="-0.24" fill="#222">2 chased noise — and you</text><text xml:space="preserve" x="16" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" letter-spacing="-0.24" fill="#222">caught Ben’s real</text><text xml:space="preserve" x="16" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" letter-spacing="-0.24" fill="#222">decline, late.</text><text x="16" y="152" font-size="12" fill="#667">Every call you made, on one shared band.</text><text x="16" y="169" font-size="12" fill="#667">Rings = you opened a conversation. Only the</text><text x="16" y="186" font-size="12" fill="#667">sustained walk out of the band was real.</text><rect x="16" y="226.4" width="324" height="79.7" fill="#667" fill-opacity="0.12"/><text x="336" y="223.41" font-size="10" text-anchor="end" fill="#667">routine-variation band</text><polyline points="16,234.5 62.3,253.5 108.6,259.9 154.9,247.2 201.1,234.5 247.4,272.6 293.7,279 340,253.5" fill="none" stroke=