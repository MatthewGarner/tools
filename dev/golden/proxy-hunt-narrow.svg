<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1906" viewBox="0 0 390 1906" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="proxy-hunt-name proxy-hunt-description" data-layout="proxy-hunt-narrow"><title id="proxy-hunt-name">Lantern invite pressure — Proxy Hunt</title><desc id="proxy-hunt-description">Tool-derived review state: 1 failure theory is fully stated; 0 are incomplete. No scoped receipt is selected in this full-hunt view.. Intended theory: Prompt every active member; A timely prompt helps a member invite a collaborator who returns; Groups retain after week one. Failure theories: fatigue: Repeated prompts pressure people into low-intent invitations; status reported pattern. Causal limit: The mechanism is an authored hypothesis, not proof of causal effect. Mechanism remains a hypothesis.. Author-stated verdict (hunt-level annotation, not a theory conclusion): Keep invitation rate paired with seven-day invitee retention while this concern is tested.. Reported pattern does not establish causality. Mechanism remains a hypothesis.</desc><rect x="0" y="0" width="390" height="1906" fill="#f0f2f8"/><text x="16" y="32" font-size="9" font-weight="800" letter-spacing="1.1" fill="#b33">PROXY HUNT · AGGREGATE REVIEW</text><text x="374" y="32" font-size="8" font-weight="750" text-anchor="end" fill="#667">AUTHORED DATE ·</text><text x="374" y="44" font-size="8" font-weight="750" text-anchor="end" fill="#667">2026-08-13</text><text x="16" y="63" font-size="22" font-weight="700" fill="#222">Lantern invite pressure</text><text x="16" y="108" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">REVIEW STATE · TOOL-DERIVED</text><text x="16" y="121" font-size="16" font-weight="750" fill="#222">1 failure theory is fully stated; 0 are incomplete.</text><text x="16" y="143" font-size="16" font-weight="750" fill="#222">No scoped receipt is selected in this full-hunt</text><text x="16" y="165" font-size="16" font-weight="750" fill="#222">view.</text><text x="16" y="193" font-size="10" font-weight="650" fill="#667">The mechanism is an authored hypothesis, not proof</text><text x="16" y="207" font-size="10" font-weight="650" fill="#667">of causal effect. Mechanism remains a hypothesis.</text><text x="16" y="241" font-size="8" font-weight="800" letter-spacing="0.75" fill="#0A6C94">AUTHOR-STATED VERDICT · HUNT-LEVEL</text><text x="16" y="254" font-size="14" font-weight="700" fill="#222">Keep invitation rate paired with seven-day invitee</text><text x="16" y="274" font-size="14" font-weight="700" fill="#222">retention while this concern is tested.</text><g data-kind="target-and-measurement"><rect x="16" y="314" width="358" height="161" fill="#1F4FD806" stroke="#bbc3d5" stroke-width="1"/><text x="30" y="336" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">DESIRED OUTCOME</text><text x="30" y="357" font-size="13" font-weight="600" fill="#222">Groups retain after week one</text><text x="30" y="384" font-size="8" font-weight="800" letter-spacing="0.75" fill="#0A6C94">MEASURE UNDER PRESSURE</text><text x="30" y="405" font-size="13" font-weight="750" fill="#222">Invitation rate</text><text x="30" y="432" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">ACTION UNDER REVIEW</text><text x="30" y="453" font-size="13" font-weight="600" fill="#222">Prompt every active member</text></g><g data-kind="causal-limitation"><rect x="16" y="491" width="358" height="94" fill="none" stroke="#bbc3d5" stroke-width="1"/><text x="30" y="512" font-size="8" font-weight="800" letter-spacing="0.75" fill="#b33">CAUSAL LIMIT</text><text x="30" y="532" font-size="11" font-weight="700" fill="#667">The mechanism is an authored hypothesis, not</text><text x="30" y="548" font-size="11" font-weight="700" fill="#667">proof of causal effect. Mechanism remains a</text><text x="30" y="564" font-size="11" font-weight="700" fill="#667">hypothesis.</text></g><text x="16" y="611" font-size="9" font-weight="800" letter-spacing="0.9" fill="#0A6C94">INTENDED THEORY</text><g data-kind="intended-route"><rect x="16" y="627" width="358" height="74" fill="#1F4FD808" stroke="#1F4FD8" stroke-width="1"/><text x="28" y="644" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">ACTION</text><text x="28" y="666" font-size="13" font-weight="600" fill="#222">Prompt every active member</text><line x1="195" y1="706" x2="195" y2="726" stroke="#1F4FD8" stroke-width="1.5"/><polygon points="195,726 191,719 199,719" fill="#1F4FD8"/><rect x="16" y="731" width="358" height="75" fill="#1F4FD808" stroke="#1F4FD8" stroke-width="1.5"/><text x="28" y="748" font-size="8" font-weight="800" letter-spacing="0.75" fill="#1F4FD8">INTENDED MECHANISM</text><text x="28" y="770" font-size="13" font-weight="700" fill="#222">A timely prompt helps a member invite a</text><text x="28" y="788" font-size="13" font-weight="700" fill="#222">collaborator who returns</text><line x1="195" y1="811" x2="195" y2="831" stroke="#1F4FD8" stroke-width="1.5"/><polygon points="195,831 191,824 199,824" fill="#1F4FD8"/><rect x="16" y="836" width="358" height="74" fill="#1F4FD808" stroke="#1F4FD8" stroke-width="1"/><text x="28" y="853" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">DESIRED OUTCOME</text><text x="28" y="875" font-size="13" font-weight="600" fill="#222">Groups retain after week one</text></g><text x="16" y="944" font-size="9" font-weight="800" letter-spacing="0.9" fill="#b33">FAILURE THEORY REGISTER</text><g data-kind="failure-theory" data-theory-id="fatigue"><rect x="16" y="960" width="358" height="599" fill="#f0f1f1" stroke="#bbc3d5" stroke-width="1"/><text x="30" y="980" font-size="9" font-weight="800" letter-spacing="0.85" fill="#b33">FAILURE THEORY · FATIGUE</text><text x="30" y="999" font-size="8" font-weight="800" letter-spacing="0.65" fill="#b33">REPORTED PATTERN</text><g data-kind="failure-route"><rect x="30" y="1018" width="330" height="74" fill="none" stroke="#b33" stroke-width="1"/><text x="42" y="1035" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">ACTION</text><text x="42" y="1057" font-size="13" font-weight="600" fill="#222">Prompt every active member</text><line x1="195" y1="1097" x2="195" y2="1117" stroke="#b33" stroke-width="1.5"/><polygon points="195,1117 191,1110 199,1110" fill="#b33"/><rect x="30" y="1122" width="330" height="75" fill="none" stroke="#b33" stroke-width="1.5"/><text x="42" y="1139" font-size="8" font-weight="800" letter-spacing="0.75" fill="#b33">FAILURE MECHANISM</text><text x="42" y="1161" font-size="13" font-weight="700" fill="#222">Repeated prompts pressure people into</text><text x="42" y="1179" font-size="13" font-weight="700" fill="#222">low-intent invitations</text><line x1="195" y1="1202" x2="195" y2="1222" stroke="#b33" stroke-width="1.5"/><polygon points="195,1222 191,1215 199,1215" fill="#b33"/><rect x="30" y="1227" width="330" height="74" fill="none" stroke="#b33" stroke-width="1"/><text x="42" y="1244" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">HARMED OUTCOME</text><text x="42" y="1266" font-size="13" font-weight="600" fill="#222">New members retain trust</text></g><line x1="30" y1="1310" x2="360" y2="1310" stroke="#bbc3d5" stroke-width="1"/><text x="30" y="1325" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">PAIRED GUARDRAIL</text><text x="30" y="1345" font-size="13" font-weight="700" fill="#222">Seven-day invitee retention</text><text x="30" y="1379" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">BASIS</text><text x="30" y="1399" font-size="11" font-weight="550" fill="#222">Reasoned mechanism</text><text x="30" y="1431" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">AUTHORED SUPPORT</text><text x="30" y="1451" font-size="11" font-weight="550" fill="#222">Support conversations show pressure is felt</text><text x="30" y="1483" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">WHAT WOULD WEAKEN THIS CONCERN</text><text x="30" y="1503" font-size="11" font-weight="550" fill="#222">Matched cohorts show retained invitees do not</text><text x="30" y="1519" font-size="11" font-weight="550" fill="#222">fall</text></g><g data-kind="reported-pattern"><rect x="16" y="1575" width="358" height="303" fill="#1F4FD806" stroke="#1F4FD8" stroke-width="1"/><text x="30" y="1597" font-size="9" font-weight="800" letter-spacing="0.9" fill="#0A6C94">REPORTED PATTERN</text><text x="30" y="1619" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">PROXY READING</text><text x="30" y="1639" font-size="12" font-weight="650" fill="#222">Invitation rate rose from 11% to 19%</text><text x="30" y="1669" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">PROTECTED OUTCOME READING</text><text x="30" y="1689" font-size="12" font-weight="650" fill="#222">Seven-day invitee retention fell from 42% to</text><text x="30" y="1706" font-size="12" font-weight="650" fill="#222">35% · New members retain trust</text><text x="30" y="1736" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">POPULATION · HORIZON</text><text x="30" y="1756" font-size="12" font-weight="650" fill="#222">New solo members · First seven days</text><text x="30" y="1786" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">COMPARATOR · SOURCE</text><text x="30" y="1806" font-size="12" font-weight="650" fill="#222">Prior prompt · Lantern event readout</text><line x1="30" y1="1835" x2="360" y2="1835" stroke="#bbc3d5" stroke-width="1"/><text x="30" y="1854" font-size="10" font-weight="700" fill="#667">Reported pattern does not establish causality.</text><text x="30" y="1868" font-size="10" font-weight="700" fill="#667">Mechanism remains a hypothesis.</text></g></svg>