xt><text x="42" y="1086" font-size="13" font-weight="700" fill="#222">low-intent invitations</text><line x1="195" y1="1109" x2="195" y2="1129" stroke="#b33" stroke-width="1.5"/><polygon points="195,1129 191,1122 199,1122" fill="#b33"/><rect x="30" y="1134" width="330" height="74" fill="none" stroke="#b33" stroke-width="1"/><text x="42" y="1151" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">HARMED OUTCOME</text><text x="42" y="1173" font-size="13" font-weight="600" fill="#222">New members retain trust</text></g><line x1="30" y1="1217" x2="360" y2="1217" stroke="#bbc3d5" stroke-width="1"/><text x="30" y="1232" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">PAIRED GUARDRAIL</text><text x="30" y="1252" font-size="13" font-weight="700" fill="#222">Seven-day invitee retention</text><text x="30" y="1286" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">BASIS</text><text x="30" y="1306" font-size="11" font-weight="550" fill="#222">Reasoned mechanism</text><text x="30" y="1338" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">AUTHORED SUPPORT</text><text x="30" y="1358" font-size="11" font-weight="550" fill="#222">Support conversations show pressure is felt</text><text x="30" y="1390" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">WHAT WOULD WEAKEN THIS CONCERN</text><text x="30" y="1410" font-size="11" font-weight="550" fill="#222">Matched cohorts show retained invitees do not</text><text x="30" y="1426" font-size="11" font-weight="550" fill="#222">fall</text></g><g data-kind="reported-pattern"><rect x="16" y="1482" width="358" height="303" fill="#1F4FD806" stroke="#1F4FD8" stroke-width="1"/><text x="30" y="1504" font-size="9" font-weight="800" letter-spacing="0.9" fill="#0A6C94">REPORTED PATTERN</text><text x="30" y="1526" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">PROXY READING</text><text x="30" y="1546" font-size="12" font-weight="650" fill="#222">Invitation rate rose from 11% to 19%</text><text x="30" y="1576" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">PROTECTED OUTCOME READING</text><text x="30" y="1596" font-size="12" font-weight="650" fill="#222">Seven-day invitee retention fell from 42% to</text><text x="30" y="1613" font-size="12" font-weight="650" fill="#222">35% · New members retain trust</text><text x="30" y="1643" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">POPULATION · HORIZON</text><text x="30" y="1663" font-size="12" font-weight="650" fill="#222">New solo members · First seven days</text><text x="30" y="1693" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">COMPARATOR · SOURCE</text><text x="30" y="1713" font-size="12" font-weight="650" fill="#222">Prior prompt · Habitat event readout</text><line x1="30" y1="1742" x2="360" y2="1742" stroke="#bbc3d5" stroke-width="1"/><text x="30" y="1761" font-size="10" font-weight="700" fill="#667">Reported pattern does not establish causality.</text><text x="30" y="1775" font-size="10" font-weight="700" fill="#667">Mechanism remains a hypothesis.</text></g></svg>