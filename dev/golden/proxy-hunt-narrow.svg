<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1813" viewBox="0 0 390 1813" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="proxy-hunt-name proxy-hunt-description" data-layout="proxy-hunt-narrow"><title id="proxy-hunt-name">Habitat invite pressure — Proxy Hunt</title><desc id="proxy-hunt-description">Verdict: 1 failure theory is fully stated; 0 are incomplete. No scoped receipt is selected in this full-hunt view.. Intended theory: Prompt every active member; A timely prompt helps a member invite a collaborator who returns; Groups retain after week one. Failure theories: fatigue: Repeated prompts pressure people into low-intent invitations; status reported pattern. Causal limit: The mechanism is an authored hypothesis, not proof of causal effect. Mechanism remains a hypothesis. Reported pattern does not establish causality. Mechanism remains a hypothesis.</desc><rect x="0" y="0" width="390" height="1813" fill="#f0f2f8"/><text x="16" y="32" font-size="9" font-weight="800" letter-spacing="1.1" fill="#b33">PROXY HUNT · AGGREGATE REVIEW</text><text x="374" y="32" font-size="8" font-weight="750" text-anchor="end" fill="#667">AUTHORED DATE ·</text><text x="374" y="44" font-size="8" font-weight="750" text-anchor="end" fill="#667">2026-08-13</text><text x="16" y="63" font-size="22" font-weight="700" fill="#222">Habitat invite pressure</text><text x="16" y="101" font-size="16" font-weight="750" fill="#222">1 failure theory is fully stated; 0 are incomplete.</text><text x="16" y="123" font-size="16" font-weight="750" fill="#222">No scoped receipt is selected in this full-hunt</text><text x="16" y="145" font-size="16" font-weight="750" fill="#222">view.</text><text x="16" y="173" font-size="10" font-weight="650" fill="#667">The mechanism is an authored hypothesis, not proof</text><text x="16" y="187" font-size="10" font-weight="650" fill="#667">of causal effect. Mechanism remains a hypothesis.</text><g data-kind="target-and-m