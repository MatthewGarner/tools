<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 972" width="390" height="972" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-labelledby="bets-title bets-desc"><title id="bets-title">Q3 product portfolio</title><desc id="bets-desc">Independent baseline: 52% lose money, median outcome −13. Shared-outcome stress: 61% lose money, median outcome −76.</desc><rect width="390" height="972" fill="#f7f8f6"/><text x="16" y="30" font-family="'Helvetica Neue',Helvetica,'Segoe UI',Roboto,sans-serif" font-size="21" fill="#222">Q3 product portfolio</text><text x="16" y="52" font-size="11" fill="#667">3 bets · 2 flagged · stake 400</text><rect data-condition="independent" x="16" y="64" width="175" height="112" fill="#fff" stroke="#ddd"/><text x="26" y="82" font-size="8.2" font-weight="700" letter-spacing="0.035em" fill="#667">INDEPENDENT BASELINE</text><text x="26" y="107" font-size="13" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#b33">P(LOSES MONEY) 52%</text><text x="26" y="127" font-size="8.6" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#222">MEDIAN OUTCOME −13 · P10 −132 · P90 +624</text><text x="26" y="145" font-size="8.5" fill="#667">If each bet resolves on its own</text><rect data-condition="shared" x="199" y="64" width="175" height="112" fill="#fff" stroke="#ddd"/><text x="209" y="82" font-size="8.2" font-weight="700" letter-spacing="0.035em" fill="#667">SHARED-OUTCOME STRESS</text><text x="209" y="107" font-size="13" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#b33">P(LOSES MONEY) 61%</text><text x="209" y="127" font-size="8.6" font-weight="600" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#222">MEDIAN OUTCOME −76 · P10 −142 · P90 +674</text><text x="209" y="145" font-size="8.5" fill="#667">If realised wins and losses move</text><text x="209" y="156" font-size="8.5" fill="#