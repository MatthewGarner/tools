 outcome −80</text><text data-mc="" x="16" y="270" font-size="11" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#222">P10 −140 · P90 +690</text><text x="16" y="289" font-size="11" fill="#667">If realised wins and losses move together; parameter ranges</text><text x="16" y="304" font-size="11" fill="#667">stay independent</text><line x1="16" y1="320" x2="374" y2="320" stroke="#ddd"/></g><text x="16" y="345" font-size="11" font-weight="700" fill="#0A6C94">Since 2026-06-01: 1 new · 1 killed · odds moved</text><text x="16" y="360" font-size="11" font-weight="700" fill="#0A6C94">on 1.</text><text x="16" y="380" font-size="10.5" font-weight="600" fill="#9A6A00">Concentration: Billing rewrite is 50% of total</text><text x="16" y="394" font-size="10.5" font-weight="600" fill="#9A6A00">stake — one bet carries the book.</text><rect x="16" y="414" width="4" height="16" rx="0" fill="#08c"/><text x="28" y="427" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#0A6C94">GROWTH</text><g data-row="bet"><line x1="16" y1="438" x2="374" y2="438" stroke="#ddd" stroke-width="1"/><text x="28" y="456" font-size="14" font-weight="600" fill="#222">Search revamp</text><text x="28" y="468" font-size="8.5" font-weight="700" letter-spacing="0.06em" fill="#667">STAKE</text><text x="28" y="484" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#222">120</text><text x="147.33" y="468" font-size="8.5" font-weight="700" letter-spacing="0.06em" fill="#667">ODDS</text><text x="147.33" y="484" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#222">30–50%</text><text x="266.67" y="468" font-size="8.5" font-weight="700" letter-spacing="0.06em" fill="#667">PAYOFF</text><text x="266.67" y="484" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#222">400–900</text><line x1="28" y1="506" x2="362" y2="506" stroke="#ddd"/><line x1="105.36" y1="499" x2="105.36" y2="513" stroke="#