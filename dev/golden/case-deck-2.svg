<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-case-deck="" data-page="3" role="img"><title>Morrow / Paid tier — The argument (continued)</title><rect width="1600" height="900" fill="#F6F3ED"/><text x="72" y="76" font-family="DM Sans" font-size="16" font-weight="600" fill="#526F65">CASE / THE ARGUMENT · CONTINUED</text><line x1="72" y1="126" x2="1528" y2="126" stroke="#c9c7c2"/><g data-source-field="claim.1.label"><text x="72" y="176" font-family="Instrument Serif" font-size="34" font-weight="400" fill="#171914">Contribution depends on paid demand</text></g><g data-source-field="claim.1.basis.label"><text x="484" y="157" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">BASIS</text></g><g data-source-field="claim.1.basis"><text x="484" y="191" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">model</text></g><g data-source-field="claim.1.detail.label"><text x="484" y="234" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">ARGUMENT</text></g><g data-source-field="claim.1.detail"><text x="484" y="268" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Fermi makes the conditional payoff assumptions inspectable before they enter the decision tree.</text></g><g data-source-field="claim.1.qualification.label"><text x="484" y="311" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">QUALIFICATION</text></g><g data-source-field="claim.1.qualification"><text x="484" y="345" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Payoff variants are not probabilities. Fixed inputs can produce 100% of simulations without establishing real-world certainty.</text></g><g data-source-field="claim.1.assumptions.label"><text x="484" y="388" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">ASSUMPTIONS</text></g><g data-source-field="claim.1.assumptions"><text x="484" y="422" font-family="DM Sans" font-size="