<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-case-deck="" data-page="1" role="img"><title>Morrow / Paid tier — Decision review</title><rect width="1600" height="900" fill="#F6F3ED"/><text x="72" y="76" font-family="DM Sans" font-size="16" font-weight="600" fill="#526F65">CASE / DECISION REVIEW</text><line x1="1080" y1="142" x2="1080" y2="794" stroke="#c9c7c2"/><g data-source-field="title"><text x="72" y="162" font-family="DM Sans" font-size="20" font-weight="400" fill="#526F65">Morrow / Paid tier</text></g><g data-source-field="headline"><text x="72" y="253" font-family="Instrument Serif" font-size="64" font-weight="400" fill="#171914">Fund the pilot. Keep launch open.</text></g><g data-source-field="question.label"><text x="72" y="309" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">QUESTION</text></g><g data-source-field="question"><text x="72" y="344" font-family="DM Sans" font-size="25" font-weight="400" fill="#171914">Launch the paid tier now, learn first, or defer?</text></g><g data-source-field="decision.label"><text x="72" y="387" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">AUTHORISED</text></g><g data-source-field="decision"><text x="72" y="427" font-family="DM Sans" font-size="30" font-weight="400" fill="#171914">Pilot approved</text></g><g data-source-field="verdict.label"><text x="72" y="472" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">JUDGMENT</text></g><g data-source-field="verdict"><text x="72" y="510" font-family="DM Sans" font-size="28" font-weight="400" fill="#171914">Fund an eight-week pilot, subject to the £13.6k cost ceiling.</text></g><g data-source-field="unresolved.label"><text x="72" y="554" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">STILL OPEN</text></g><g data-source-field="unresolved"><text x="72" y="588" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Paid-tier launch remains undecided</text></g><g data-source-field="constraints.label"><text x="72" y="631" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">HARD CONSTRAINTS</text></g><g data-source-field="constraints"><text x="72" y="665" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Pilot approval does not authorise a general launch. Reconfirm budget before recruitment.</text></g><g data-source-field="reconsider.label"><text x="72" y="708" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">RECONSIDER WHEN</text></g><g data-source-field="reconsider"><text x="72" y="742" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Total pilot cost exceeds £13.6k, or the signal is less informative than assumed.</text></g><g data-source-field="status.label"><text x="1120" y="157" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">STATUS</text></g><g data-source-field="status"><text x="1120" y="191" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">decided</text></g><g data-source-field="owner.label"><text x="1120" y="234" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">DECISION OWNER</text></g><g data-source-field="owner"><text x="1120" y="268" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">Pricing lead</text></g><g data-source-field="date.label"><text x="1120" y="311" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">DECISION DATE</text></g><g data-source-field="date"><text x="1120" y="345" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">2026-09-05</text></g><g data-source-field="reviewBy.label"><text x="1120" y="388" font-family="DM Sans" font-size="15" font-weight="600" fill="#686B65">REVIEW BY</text></g><g data-source-field="reviewBy"><text x="1120" y="422" font-family="DM Sans" font-size="24" font-weight="400" fill="#171914">2026-11-13</text></g><line x1="72" y1="833" x2="1528" y2="833" stroke="#c9c7c2"/><text x="72" y="864" font-family="DM Sans" font-size="16" fill="#686B65">Morrow / Paid tier</text><text x="1528" y="864" text-anchor="end" font-family="DM Sans" font-size="16" fill="#686B65">1 / 5</text></svg>