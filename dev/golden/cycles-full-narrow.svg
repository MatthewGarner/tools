<svg xmlns='http://www.w3.org/2000/svg' width='360' height='1368' viewBox='0 0 360 1368' font-family='"Helvetica Neue",Helvetica,"Segoe UI",Roboto,sans-serif'><rect width='360' height='1368' fill='#f7f8f6'/><rect x='48' y='18' width='34' height='4' fill='#08c'/><text x="48" y="42" font-size="18" font-weight="700" fill="#222">Cycle budget — Wexcombe 100MW/2h</text><rect x='24' y='58' width='312' height='418' rx='0' fill='#fff' stroke='#ddd'/><text x="44" y="84" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#667">THE CYCLE PRICE</text><rect x='48' y='98' width='53.1' height='34' fill='none'/><text x="74.54" y="112" font-size="11" text-anchor="middle" fill="#b33">don’t cycle</text><path d='M48 132 L50.1 132.0 L54.2 132.0 L58.3 132.0 L62.4 132.0 L66.6 132.0 L70.7 131.6 L74.8 132.0 L78.9 131.6 L83.1 132.0 L87.2 129.1 L91.3 127.9 L95.4 122.5 L99.6 123.3 L103.7 116.2 L107.8 111.7 L111.9 109.6 L116.1 110.0 L120.2 105.9 L124.3 102.1 L128.4 98.0 L132.6 107.5 L136.7 105.5 L140.8 108.0 L144.9 109.6 L149.1 112.5 L153.2 115.8 L157.3 121.6 L161.4 117.9 L165.6 120.0 L169.7 123.3 L173.8 121.6 L177.9 127.0 L182.1 125.8 L186.2 127.9 L190.3 129.1 L194.4 128.3 L198.6 130.3 L202.7 129.5 L206.8 131.6 L210.9 132.0 L215.1 131.2 L219.2 131.6 L223.3 131.2 L227.4 132.0 L231.6 132.0 L235.7 132.0 L239.8 132.0 L243.9 132.0 L248.1 132.0 L252.2 132.0 L256.3 132.0 L260.4 132.0 L264.6 132.0 L268.7 132.0 L272.8 132.0 L276.9 132.0 L281.1 131.6 L285.2 132.0 L289.3 132.0 L293.4 132.0 L297.6 132.0 L301.7 131.6 L305.8 132.0 L309.9 132.0 L312 132 Z' fill='none' stroke='none'/><text x="308" y="110" font-size="11" text-anchor="end" fill="#667">ribbon = days</text><line x1='101.1' y1='92' x2='101.1' y2='142' stroke='#08c' stroke-width='2.5'/><rect x='97.8' y='138' width='5.4' height='8' rx='0' fill='none'/><line x1='97.8' y1='137' x2='97.8' y2='147' stroke='#08c' stroke-width='2.5'/><line x1='103.2' y1='137' x2='103.2' y2='147' stroke='#08c' stroke-width='2.5'/><text x="48" y="160" font-size="11.5" text-anchor="start" fill="#667">£31.7/MWh · whisker = beliefs</text><text x="115.08" y="124" font-size="11.5" fill="#222">~345 days a year clear</text><g><rect x='44.0' y='172' width='55.0' height='22' rx='0' fill='none'/><text x="54" y="187" font-size="12" font-weight="600" fill="#222">100MW</text></g><g><rect x='107.0' y='172' width='62.0' height='22' rx='0' fill='none'/><text x="117" y="187" font-size="12" font-weight="600" fill="#222">200MWh</text></g><rect x='177.0' y='172' width='111.0' height='22' rx='0' fill='none'/><text x="187" y="187" font-size="12" font-weight="600" fill="#667">spread</text><g><text x="236" y="187" font-size="12" font-weight="600" fill="#222">35</text></g><text x="250" y="187" font-size="12" font-weight="600" fill="#667">..</text><g><text x="264" y="187" font-size="12" font-weight="600" fill="#222">85</text></g><rect x='44.0' y='200' width='146.0' height='22' rx='0' fill='none'/><text x="54" y="215" font-size="12" font-weight="600" fill="#667">fade</text><g><text x="89" y="215" font-size="12" font-weight="600" fill="#222">0.006</text></g><text x="124" y="215" font-size="12" font-weight="600" fill="#667">..</text><g><text x="138" y="215" font-size="12" font-weight="600" fill="#222">0.012%</text></g><g><rect x='198.0' y='200' width='97.0' height='22' rx='0' fill='none'/><text x="208" y="215" font-size="12" font-weight="600" fill="#222">budget 6000</text></g><g><rect x='44.0' y='228' width='83.0' height='22' rx='0' fill='none'/><text x="54" y="243" font-size="12" font-weight="600" fill="#222">over 15yr</text></g><rect x='135.0' y='228' width='111.0' height='22' rx='0' fill='none'/><text x="145" y="243" font-size="12" font-weight="600" fill="#667">charge</text><g><text x="194" y="243" font-size="12" font-weight="600" fill="#222">15</text></g><text x="208" y="243" font-size="12" font-weight="600" fill="#667">..</text><g><text x="222" y="243" font-size="12" font-weight="600" fill="#222">45</text></g><rect x='44.0' y='256' width='97.0' height='22' rx='0' fill='none'/><text x="54" y="271" font-size="12" font-weight="600" fill="#667">rte</text><g><text x="82" y="271" font-size="12" font-weight="600" fill="#222">86</text></g><text x="96" y="271" font-size="12" font-weight="600" fill="#667">..</text><g><text x="110" y="271" font-size="12" font-weight="600" fill="#222">90%</text></g><rect x='149.0' y='256' width='132.0' height='22' rx='0' fill='none'/><text x="159" y="271" font-size="12" font-weight="600" fill="#667">calendar</text><g><text x="222" y="271" font-size="12" font-weight="600" fill="#222">1</text></g><text x="229" y="271" font-size="12" font-weight="600" fill="#667">..</text><g><text x="243" y="271" font-size="12" font-weight="600" fill="#222">1.8%</text></g><g><rect x='44.0' y='284' width='307.0' height='22' rx='0' fill='none'/><text x="54" y="299" font-size="12" font-weight="600" fill="#667">binds in yr 1: warranty 10/10 · wear 0/10</text></g><rect x='48' y='316' width='4' height='154' fill='#08c'/><text x="66" y="332" font-size="15" fill="#222">Cycles are worth £31.7/MWh each</text><text x="66" y="354" font-size="15" fill="#222">in year 1 (P10 £29.8/MWh – P90</text><text x="66" y="376" font-size="15" fill="#222">£33/MWh) — only dispatch above</text><text x="66" y="398" font-size="15" fill="#222">that; 345 days a year clear it.</text><text x="66" y="420" font-size="15" fill="#222">In year 1 it’s the warranty</text><text x="66" y="442" font-size="15" fill="#222">doing the rationing, not the</text><text x="66" y="464" font-size="15" fill="#222">wear, in 10 runs in 10.</text><rect x='24' y='494' width='312' height='328' rx='0' fill='#fff' stroke='#ddd'/><text x="44" y="520" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#667">THE SECOND CYCLE</text><rect x='48' y='534' width='53.1' height='30' fill='none'/><path d='M48 564 L50.1 564.0 L54.2 563.8 L58.3 563.0 L62.4 557.3 L66.6 549.1 L70.7 540.4 L74.8 538.2 L78.9 534.0 L83.1 536.7 L87.2 538.0 L91.3 537.2 L95.4 545.9 L99.6 549.1 L103.7 555.8 L107.8 555.1 L111.9 559.5 L116.1 560.0 L120.2 562.0 L124.3 562.5 L128.4 562.3 L132.6 563.8 L136.7 563.5 L140.8 563.0 L144.9 564.0 L149.1 564.0 L153.2 564.0 L157.3 564.0 L161.4 563.8 L165.6 564.0 L169.7 564.0 L173.8 564.0 L177.9 564.0 L182.1 564.0 L186.2 564.0 L190.3 564.0 L194.4 564.0 L198.6 564.0 L202.7 564.0 L206.8 564.0 L210.9 564.0 L215.1 564.0 L219.2 564.0 L223.3 564.0 L227.4 564.0 L231.6 564.0 L235.7 564.0 L239.8 564.0 L243.9 564.0 L248.1 564.0 L252.2 564.0 L256.3 564.0 L260.4 564.0 L264.6 564.0 L268.7 564.0 L272.8 564.0 L276.9 564.0 L281.1 564.0 L285.2 564.0 L289.3 564.0 L293.4 564.0 L297.6 564.0 L301.7 564.0 L305.8 564.0 L309.9 564.0 L312 564 Z' fill='none' stroke='none'/><line x1='101.1' y1='528' x2='101.1' y2='570' stroke='#08c' stroke-width='2.5'/><text x="308" y="546" font-size="11" text-anchor="end" fill="#667">2nd-cycle days</text><g><rect x='44.0' y='580' width='118.0' height='22' rx='0' fill='none'/><text x="54" y="595" font-size="12" font-weight="600" fill="#222">second 35..60%</text></g><g><rect x='170.0' y='580' width='125.0' height='22' rx='0' fill='none'/><text x="180" y="595" font-size="12" font-weight="600" fill="#667">+£310k/yr gross</text></g><g><rect x='44.0' y='608' width='118.0' height='22' rx='0' fill='none'/><text x="54" y="623" font-size="12" font-weight="600" fill="#667">−£168k/yr wear</text></g><g><rect x='170.0' y='608' width='104.0' height='22' rx='0' fill='none'/><text x="180" y="623" font-size="12" font-weight="600" fill="#667">£142k/yr net</text></g><rect x='48' y='640' width='4' height='176' fill='#08c'/><text x="66" y="656" font-size="15" fill="#222">The second cycle earns £310k/yr</text><text x="66" y="678" font-size="15" fill="#222">and costs £168k/yr of wear in</text><text x="66" y="700" font-size="15" fill="#222">year 1 — £142k/yr net, and it</text><text x="66" y="722" font-size="15" fill="#222">pays over the life (£1.27M NPV).</text><text x="66" y="744" font-size="15" fill="#222">The warranty caps the pair in</text><text x="66" y="766" font-size="15" fill="#222">year 1 in 10 runs in 10 — the</text><text x="66" y="788" font-size="15" fill="#222">second cycle spends budget the</text><text x="66" y="810" font-size="15" fill="#222">best single days want back.</text><text x="48" y="836" font-size="11" text-anchor="middle" fill="#667">0</text><text x="131.61" y="836" font-size="11" text-anchor="middle" fill="#667">50</text><text x="215.23" y="836" font-size="11" text-anchor="middle" fill="#667">100</text><text x="298.84" y="836" font-size="11" text-anchor="middle" fill="#667">150</text><rect x='24' y='840' width='312' height='488' rx='0' fill='#fff' stroke='#ddd'/><text x="44" y="866" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#667">THE ASSET LIFE</text><rect x='66.4' y='884' width='33.6' height='190' fill='none'/><text x="83.2" y="1066" font-size="11" text-anchor="middle" fill="#222">augment window</text><path d='M56.8 884.0 L74.4 896.0 L92.0 906.1 L109.6 915.7 L127.2 925.1 L144.8 934.1 L162.4 942.8 L180.0 951.4 L197.6 960.0 L215.2 968.4 L232.8 976.6 L250.4 984.6 L268.0 992.4 L285.6 1000.0 L303.2 1007.4 L303.2 1050.3 L285.6 1042.6 L268.0 1034.5 L250.4 1025.9 L232.8 1016.8 L215.2 1007.1 L197.6 996.9 L180.0 986.1 L162.4 974.7 L144.8 962.5 L127.2 950.3 L109.6 936.6 L92.0 922.8 L74.4 908.6 L56.8 895.5 Z' fill='none' stroke='none'/><path d='M56.8 888.5 L74.4 901.4 L92.0 913.8 L109.6 925.8 L127.2 937.4 L144.8 948.4 L162.4 959.0 L180.0 969.1 L197.6 978.7 L215.2 988.1 L232.8 997.2 L250.4 1005.9 L268.0 1014.2 L285.6 1022.4 L303.2 1030.1' fill='none' stroke='#08c' stroke-width='2.5'/><text x="48" y="896" font-size="11" text-anchor="start" fill="#667">£4.19M/yr</text><text x="308" y="896" font-size="11" text-anchor="end" fill="#667">fan P10–P90</text><text x="56.8" y="1090" font-size="10.5" text-anchor="middle" fill="#667">y1</text><text x="92" y="1090" font-size="10.5" text-anchor="middle" fill="#667">y3</text><text x="127.2" y="1090" font-size="10.5" text-anchor="middle" fill="#667">y5</text><text x="162.4" y="1090" font-size="10.5" text-anchor="middle" fill="#667">y7</text><text x="197.6" y="1090" font-size="10.5" text-anchor="middle" fill="#667">y9</text><text x="232.8" y="1090" font-size="10.5" text-anchor="middle" fill="#667">y11</text><text x="268" y="1090" font-size="10.5" text-anchor="middle" fill="#667">y13</text><text x="303.2" y="1090" font-size="10.5" text-anchor="middle" fill="#667">y15</text><line x1='48' y1='1144' x2='312' y2='1144' stroke='#ddd'/><path d='M56.8 1101.9 L74.4 1103.8 L92.0 1105.7 L109.6 1107.6 L127.2 1109.5 L144.8 1111.4 L162.4 1113.3 L180.0 1115.2 L197.6 1117.1 L215.2 1119.0 L232.8 1120.9 L250.4 1122.8 L268.0 1124.7 L285.6 1126.7 L303.2 1128.6' fill='none' stroke='#667' stroke-width='1.5'/><path d='M56.8 1100.0 L74.4 1102.9 L92.0 1105.7 L109.6 1108.6 L127.2 1111.4 L144.8 1114.3 L162.4 1117.1 L180.0 1120.0 L197.6 1122.9 L215.2 1125.7 L232.8 1128.6 L250.4 1131.4 L268.0 1134.3 L285.6 1137.1 L303.2 1140.0' fill='none' stroke='#08c' stroke-width='1.5' stroke-dasharray='4 3'/><text x="312" y="1128.55" font-size="10.5" text-anchor="end" fill="#667">SoH 29%</text><text x="312" y="1152" font-size="10.5" text-anchor="end" fill="#667">0 cycles left</text><g><rect x='44.0' y='1152' width='174.0' height='22' rx='0' fill='none'/><text x="54" y="1167" font-size="12" font-weight="600" fill="#222">augment 120..180 £/kWh</text></g><g><rect x='44.0' y='1180' width='125.0' height='22' rx='0' fill='none'/><text x="54" y="1195" font-size="12" font-weight="600" fill="#222">drift -4..0%/yr</text></g><g><rect x='177.0' y='1180' width='125.0' height='22' rx='0' fill='none'/><text x="187" y="1195" font-size="12" font-weight="600" fill="#667">never pays 5/10</text></g><rect x='48' y='1212' width='4' height='110' fill='#08c'/><text x="66" y="1228" font-size="15" fill="#222">It’s a coin flip whether</text><text x="66" y="1250" font-size="15" fill="#222">augmentation pays at all (never</text><text x="66" y="1272" font-size="15" fill="#222">in 5 runs in 10) — when it does,</text><text x="66" y="1294" font-size="15" fill="#222">the window is years</text><text x="66" y="1316" font-size="15" fill="#222">2–3 (P25–P75).</text></svg>