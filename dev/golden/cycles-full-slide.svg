<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='912' viewBox='0 0 1280 912' font-family='"Helvetica Neue",Helvetica,"Segoe UI",Roboto,sans-serif'><rect width='1280' height='912' fill='#f7f8f6'/><rect x='48' y='34' width='34' height='4' fill='#08c'/><text x="48" y="66" font-size="26" font-weight="700" fill="#222">Cycle budget — Wexcombe 100MW/2h</text><rect x='24' y='92' width='1232' height='222' rx='0' fill='#fff' stroke='#ddd'/><text x="44" y="118" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#667">THE CYCLE PRICE — DISPATCH THRESHOLD</text><rect x='300' y='132' width='188.7' height='34' fill='none'/><text x="394.33" y="146" font-size="11" text-anchor="middle" fill="#b33">don’t cycle</text><path d='M300 166 L307.3 166.0 L321.8 166.0 L336.4 166.0 L351.0 166.0 L365.5 166.0 L380.1 166.0 L394.7 165.9 L409.2 165.6 L423.8 164.9 L438.3 163.3 L452.9 160.9 L467.5 157.3 L482.0 152.9 L496.6 148.0 L511.2 143.2 L525.7 138.9 L540.3 135.4 L554.8 133.1 L569.4 132.0 L584.0 132.1 L598.5 133.2 L613.1 135.1 L627.7 137.5 L642.2 140.2 L656.8 143.0 L671.3 145.9 L685.9 148.6 L700.5 151.2 L715.0 153.5 L729.6 155.5 L744.2 157.3 L758.7 158.9 L773.3 160.1 L787.8 161.3 L802.4 162.1 L817.0 162.9 L831.5 163.5 L846.1 164.0 L860.7 164.4 L875.2 164.7 L889.8 165.0 L904.3 165.2 L918.9 165.4 L933.5 165.5 L948.0 165.6 L962.6 165.7 L977.2 165.8 L991.7 165.9 L1006.3 165.9 L1020.8 165.9 L1035.4 166.0 L1050.0 165.9 L1064.5 166.0 L1079.1 166.0 L1093.7 166.0 L1108.2 166.0 L1122.8 166.0 L1137.3 166.0 L1151.9 166.0 L1166.5 166.0 L1181.0 166.0 L1195.6 166.0 L1210.2 166.0 L1224.7 166.0 L1232 166 Z' fill='none' stroke='none'/><text x="1228" y="144" font-size="11" text-anchor="end" fill="#667">ribbon = days</text><line x1='488.7' y1='126' x2='488.7' y2='176' stroke='#08c' stroke-width='2.5'/><rect x='477.0' y='172' width='19.1' height='8' rx='0' fill='none'/><line x1='477.0' y1='171' x2='477.0' y2='181' stroke='#08c' stroke-width='2.5'/><line x1='496.1' y1='171' x2='496.1' y2='181' stroke='#08c' stroke-width='2.5'/><text x="488.66" y="194" font-size="11.5" text-anchor="middle" fill="#667">£31.9/MWh — whisker = your beliefs (P10–P90)</text><text x="502.66" y="158" font-size="11.5" fill="#222">~345 days a year clear</text><g><rect x='44.0' y='204' width='55.0' height='22' rx='0' fill='none'/><text x="54" y="219" font-size="12" font-weight="600" fill="#222">100MW</text></g><g><rect x='107.0' y='204' width='62.0' height='22' rx='0' fill='none'/><text x="117" y="219" font-size="12" font-weight="600" fill="#222">200MWh</text></g><rect x='177.0' y='204' width='111.0' height='22' rx='0' fill='none'/><text x="187" y="219" font-size="12" font-weight="600" fill="#667">spread</text><g><text x="236" y="219" font-size="12" font-weight="600" fill="#222">35</text></g><text x="250" y="219" font-size="12" font-weight="600" fill="#667">..</text><g><text x="264" y="219" font-size="12" font-weight="600" fill="#222">85</text></g><rect x='296.0' y='204' width='146.0' height='22' rx='0' fill='none'/><text x="306" y="219" font-size="12" font-weight="600" fill="#667">fade</text><g><text x="341" y="219" font-size="12" font-weight="600" fill="#222">0.006</text></g><text x="376" y="219" font-size="12" font-weight="600" fill="#667">..</text><g><text x="390" y="219" font-size="12" font-weight="600" fill="#222">0.012%</text></g><g><rect x='450.0' y='204' width='97.0' height='22' rx='0' fill='none'/><text x="460" y="219" font-size="12" font-weight="600" fill="#222">budget 6000</text></g><g><rect x='555.0' y='204' width='83.0' height='22' rx='0' fill='none'/><text x="565" y="219" font-size="12" font-weight="600" fill="#222">over 15yr</text></g><rect x='44.0' y='232' width='111.0' height='22' rx='0' fill='none'/><text x="54" y="247" font-size="12" font-weight="600" fill="#667">charge</text><g><text x="103" y="247" font-size="12" font-weight="600" fill="#222">15</text></g><text x="117" y="247" font-size="12" font-weight="600" fill="#667">..</text><g><text x="131" y="247" font-size="12" font-weight="600" fill="#222">45</text></g><rect x='163.0' y='232' width='97.0' height='22' rx='0' fill='none'/><text x="173" y="247" font-size="12" font-weight="600" fill="#667">rte</text><g><text x="201" y="247" font-size="12" font-weight="600" fill="#222">86</text></g><text x="215" y="247" font-size="12" font-weight="600" fill="#667">..</text><g><text x="229" y="247" font-size="12" font-weight="600" fill="#222">90%</text></g><rect x='268.0' y='232' width='132.0' height='22' rx='0' fill='none'/><text x="278" y="247" font-size="12" font-weight="600" fill="#667">calendar</text><g><text x="341" y="247" font-size="12" font-weight="600" fill="#222">1</text></g><text x="348" y="247" font-size="12" font-weight="600" fill="#667">..</text><g><text x="362" y="247" font-size="12" font-weight="600" fill="#222">1.8%</text></g><g><rect x='408.0' y='232' width='307.0' height='22' rx='0' fill='none'/><text x="418" y="247" font-size="12" font-weight="600" fill="#667">binds in yr 1: warranty 10/10 · wear 0/10</text></g><rect x='48' y='264' width='4' height='44' fill='#08c'/><text x="66" y="280" font-size="15" fill="#222">Cycles are worth £31.9/MWh each in year 1 (P10 £30/MWh – P90 £33.2/MWh) — only dispatch above that; 345 days a year clear it. In year 1 it’s the warranty doing the</text><text x="66" y="302" font-size="15" fill="#222">rationing, not the wear, in 10 runs in 10.</text><rect x='24' y='332' width='1232' height='172' rx='0' fill='#fff' stroke='#ddd'/><text x="44" y="358" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#667">THE SECOND CYCLE</text><rect x='300' y='372' width='188.7' height='30' fill='none'/><path d='M300 402 L307.3 402.0 L321.8 401.7 L336.4 400.6 L351.0 396.6 L365.5 389.6 L380.1 381.5 L394.7 375.4 L409.2 372.0 L423.8 372.5 L438.3 375.9 L452.9 379.8 L467.5 384.3 L482.0 388.8 L496.6 392.1 L511.2 395.0 L525.7 397.0 L540.3 398.7 L554.8 399.5 L569.4 400.5 L584.0 400.9 L598.5 401.4 L613.1 401.5 L627.7 401.7 L642.2 401.8 L656.8 401.8 L67