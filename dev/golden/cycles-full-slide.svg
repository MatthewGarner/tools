e="11" text-anchor="middle" fill="#667">100</text><text x="1186.24" y="518" font-size="11" text-anchor="middle" fill="#667">150</text><text x="292" y="518" font-size="11" font-weight="600" text-anchor="end" fill="#667">£/MWh net</text><rect x='24' y='522' width='1232' height='350' rx='0' fill='#fff' stroke='#ddd'/><text x="44" y="548" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#667">THE ASSET LIFE</text><rect x='385.2' y='566' width='78.1' height='190' fill='none'/><text x="424.27" y="580" font-size="11" text-anchor="middle" fill="#222">augment window</text><path d='M331.1 566.0 L393.2 578.0 L455.3 588.1 L517.5 597.7 L579.6 607.1 L641.7 616.1 L703.9 624.8 L766.0 633.4 L828.1 642.0 L890.3 650.4 L952.4 658.6 L1014.5 666.6 L1076.7 674.4 L1138.8 682.0 L1200.9 689.4 L1200.9 732.3 L1138.8 724.6 L1076.7 716.5 L1014.5 707.9 L952.4 698.9 L890.3 689.1 L828.1 678.9 L766.0 668.1 L703.9 656.7 L641.7 644.5 L579.6 632.3 L517.5 618.6 L455.3 604.8 L393.2 590.6 L331.1 577.5 Z' fill='none' stroke='none'/><path d='M331.1 570.5 L393.2 583.4 L455.3 595.8 L517.5 607.8 L579.6 619.4 L641.7 630.4 L703.9 641.0 L766.0 651.1 L828.1 660.7 L890.3 670.1 L952.4 679.2 L1014.5 687.9 L1076.7 696.2 L1138.8 704.4 L1200.9 712.1' fill='none' stroke='#08c' stroke-width='2.5'/><text x="292" y="574.48" font-size="11" text-anchor="end" fill="#667">£4.18M/yr</text><text x="1228" y="578" font-size="11" text-anchor="end" fill="#667">revenue fan P10–P90</text><text x="331.07" y="772" font-size="10.5" text-anchor="middle" fill="#667">y1</text><text x="455.33" y="772" font-size="10.5" text-anchor="middle" fill="#667">y3</text><text x="579.6" y="772" font-size="10.5" text-anchor="middle" fill="#667">y5</text><text x="703.87" y="772" font-size="10.5" text-anchor="middle" fill="#667">y7</text><text x="828.13" y="772" font-size="10.5" text-anchor="middle" fill="#667">y9</text><text x="952.4" y="772" font-size="10.5" text-anchor="middle" fill="#667">y11</text><text x="1076.67" y="772" font-size="10.5" text-anchor="middle" fill="#667">y13</text><text x="1200.93" y="772" font-size="10.5" text-anchor="middle" fill="#667">y15</text><line x1='300' y1='826' x2='1232' y2='826' stroke='#ddd'/><path d='M331.1 783.9 L393.2 785.8 L455.3 787.7 L517.5 789.6 L579.6 791.5 L641.7 793.4 L703.9 795.3 L766.0 797.2 L828.1 799.1 L890.3 801.0 L952.4 802.9 L1014.5 804.8 L1076.7 806.7 L1138.8 808.7 L1200.9 810.6' fill='none' stroke='#667' stroke-width='1.5'/><path d='M331.1 782.0 L393.2 784.9 L455.3 787.7 L517.5 790.6 L579.6 793.4 L641.7 796.3 L703.9 799.1 L766.0 802.0 L828.1 804.9 L890.3 807.7 L952.4 810.6 L1014.5 813.4 L1076.7 816.3 L1138.8 819.1 L1200.9 822.0' fill='none' stroke='#08c' stroke-width='1.5' stroke-dasharray='4 3'/><text x="1232" y="810.55" font-size="10.5" text-anchor="end" fill="#667">SoH 29%</text><text x="1232" y="834" font-size="10.5" text-anchor="end" fill="#667">0 cycles left</text><g><rect x='44.0' y='814' width='174.0' height='22' rx='0' fill='none'/><text x="54" y="829" font-size="12" font-weight="600" fill="#222">augment 120..180 £/kWh</text></g><g><rect x='226.0' y='814' width='125.0' height='22' rx='0' fill='none'/><text x="236" y="829" font-size="12" font-weight="600" fill="#222">drift -4..0%/yr</text></g><g><rect x='359.0' y='814' width='125.0' height='22' rx='0' fill='none'/><text x="369" y="829" font-size="12" font-weight="600" fill="#667">never pays 5/10</text></g><rect x='48' y='844' width='4' height='22' fill='#08c'/><text x="66" y="860" font-size="15" fill="#222">It’s a coin flip whether augmentation pays at all (never in 5 runs in 10) — when it does, the window is years 2–3 (P25–P75).</text></svg>