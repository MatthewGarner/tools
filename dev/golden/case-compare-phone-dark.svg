<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1505" viewBox="0 0 390 1505" role="img" aria-label="Morrow / Paid tier" font-family="DM Sans"><rect width="390" height="1505" fill="#171A18"/><text x="16" y="35" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">Morrow / Paid tier / ALTERNATIVES</text><text x="16" y="101" font-family="Instrument Serif" font-weight="400" font-size="40" fill="#F6F3ED">Launch the paid tier now, learn first, or defer?</text><rect x="16" y="135" width="358" height="81" fill="#222926"/><text x="32" y="167" font-family="DM Sans" font-weight="600" font-size="16" fill="#F6F3ED">Pilot approved · 2026-09-05</text><text x="32" y="195" font-family="DM Sans" font-weight="400" font-size="15" fill="#B8BDB8">Paid-tier launch remains undecided</text><line x1="16" y1="246" x2="374" y2="246" stroke="#444543"/><text x="16" y="294" font-family="Instrument Serif" font-weight="400" font-size="30" fill="#F6F3ED">Run the pilot</text><text x="16" y="326" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">EXPECTED VALUE / OUTCOME</text><text x="16" y="352" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">£16.6k expected contribution under the</text><text x="16" y="373" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">authored model</text><text x="16" y="407" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">WHAT MUST BE TRUE</text><text x="16" y="433" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">£10k total pilot cost; an informative signal; eight</text><text x="16" y="454" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">weeks of learning</text><text x="16" y="488" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">MAIN DOWNSIDE</text><text x="16" y="514" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Delay reduces the viable-launch payoff from £160k</text><text x="16" y="535" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">to £140k.</text><text x="16" y="569" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">WHAT CHANGES THE CHOICE</text><text x="16" y="595" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">At total cost above £13.6k, launch now leads in</text><text x="16" y="616" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">this model.</text><line x1="16" y1="651" x2="374" y2="651" stroke="#444543"/><text x="16" y="699" font-family="Instrument Serif" font-weight="400" font-size="30" fill="#F6F3ED">Launch now</text><text x="16" y="731" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">EXPECTED VALUE / OUTCOME</text><text x="16" y="757" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">£13k expected contribution under the same prior</text><text x="16" y="791" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">WHAT MUST BE TRUE</text><text x="16" y="817" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Willingness to commit before learning about</text><text x="16" y="838" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">paid demand</text><text x="16" y="872" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">MAIN DOWNSIDE</text><text x="16" y="898" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Weak demand costs £50k in the model.</text><text x="16" y="932" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">WHAT CHANGES THE CHOICE</text><text x="16" y="958" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Becomes the model leader when the pilot loses its</text><text x="16" y="979" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">£3.6k advantage.</text><line x1="16" y1="1014" x2="374" y2="1014" stroke="#444543"/><text x="16" y="1062" font-family="Instrument Serif" font-weight="400" font-size="30" fill="#F6F3ED">Defer this quarter</text><text x="16" y="1094" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">EXPECTED VALUE / OUTCOME</text><text x="16" y="1120" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">£0 incremental contribution, the model baseline</text><text x="16" y="1154" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">WHAT MUST BE TRUE</text><text x="16" y="1180" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Accepting the opportunity cost of waiting</text><text x="16" y="1214" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">MAIN DOWNSIDE</text><text x="16" y="1240" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">No new learning about willingness to pay.</text><text x="16" y="1274" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">WHAT CHANGES THE CHOICE</text><text x="16" y="1300" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">Prefer if constraints rule out both launch and a</text><text x="16" y="1321" font-family="DM Sans" font-weight="400" font-size="16" fill="#F6F3ED">useful pilot.</text><line x1="16" y1="1368" x2="374" y2="1368" stroke="#444543"/><text x="16" y="1399" font-family="DM Sans" font-weight="600" font-size="11" fill="#758c84" letter-spacing="1.4">NON-NEGOTIABLE</text><text x="16" y="1430" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Pilot approval does not authorise a general launch.</text><text x="16" y="1452" font-family="DM Sans" font-weight="400" font-size="17" fill="#F6F3ED">Reconfirm budget before recruitment.</text></svg>