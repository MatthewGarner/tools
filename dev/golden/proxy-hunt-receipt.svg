<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1058" viewBox="0 0 900 1058" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="proxy-hunt-receipt-name proxy-hunt-receipt-description"><title id="proxy-hunt-receipt-name">Lantern invite pressure — selected failure theory receipt</title><desc id="proxy-hunt-receipt-description">Scoped receipt for fatigue. Tool-derived review state: Do not optimise Invitation rate alone: Repeated prompts pressure people into low-intent invitations. Carry Seven-day invitee retention as the paired measure.. Author-stated hunt-level annotation, not a theory conclusion: Keep invitation rate paired with seven-day invitee retention while this concern is tested.. Causal limit: The mechanism is an authored hypothesis, not proof of causal effect.</desc><rect x="0" y="0" width="900" height="1058" fill="#f0f2f8"/><text x="20" y="32" font-size="9" font-weight="800" letter-spacing="1.1" fill="#0A6C94">PROXY HUNT · REVIEW READY</text><text x="880" y="32" font-size="8" font-weight="750" text-anchor="end" fill="#667">AUTHORED DATE · 2026-08-13</text><text x="20" y="63" font-size="25" font-weight="700" fill="#222">Lantern invite pressure</text><text x="20" y="111" font-size="8" font-weight="800" letter-spacing="0.8" fill="#667">REVIEW STATE · TOOL-DERIVED</text><text x="20" y="124" font-size="18" font-weight="750" fill="#222">Do not optimise Invitation rate alone: Repeated prompts pressure people into low-intent invitations. Carry Seven-day</text><text x="20" y="149" font-size="18" font-weight="750" fill="#222">invitee retention as the paired measure.</text><text x="20" y="180" font-size="10" font-weight="650" fill="#667">The mechanism is an authored hypothesis, not proof of causal effect. Mechanism remains a hypothesis.</text><text x="20" y="214" font-size="8" font-weight="800" letter-spacing="0.75" fill="#0A6C94">AUTHOR-STATED VERDICT · HUNT-LEVEL · NOT A THEORY CONCLUSION</text><text x="20" y="227" font-size="15" font-weight="700" fill="#222">Keep invitation rate paired with seven-day invitee retention while this concern is tested.</text><g data-kind="target-and-measurement"><rect x="20" y="267" width="860" height="72" fill="#1F4FD806" stroke="#bbc3d5" stroke-width="1"/><text x="38" y="293" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">DESIRED OUTCOME</text><text x="38" y="314" font-size="11" font-weight="600" fill="#222">Groups retain after week one</text><text x="318.67" y="293" font-size="8" font-weight="800" letter-spacing="0.75" fill="#0A6C94">MEASURE UNDER PRESSURE</text><text x="318.67" y="314" font-size="11" font-weight="750" fill="#222">Invitation rate</text><text x="599.33" y="293" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">ACTION UNDER REVIEW</text><text x="599.33" y="314" font-size="11" font-weight="600" fill="#222">Prompt every active member</text></g><g data-kind="selected-theory-receipt" data-theory-id="fatigue"><rect x="20" y="357" width="860" height="677" fill="#f0f1f1" stroke="#b33" stroke-width="1.5"/><rect x="20" y="357" width="4" height="677" fill="#b33"/><text x="38" y="383" font-size="9" font-weight="800" letter-spacing="0.9" fill="#b33">FAILURE THEORY RECEIPT · SCOPED</text><text x="38" y="411" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">FAILURE THEORY</text><text x="38" y="431" font-size="11" font-weight="550" fill="#222">Repeated prompts pressure people into low-intent invitations</text><text x="38" y="458" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">HARMED OUTCOME</text><text x="38" y="478" font-size="11" font-weight="550" fill="#222">New members retain trust</text><text x="38" y="505" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">PAIRED GUARDRAIL</text><text x="38" y="525" font-size="11" font-weight="700" fill="#222">Seven-day invitee retention</text><text x="38" y="552" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">BASIS</text><text x="38" y="572" font-size="11" font-weight="550" fill="#222">Reasoned mechanism</text><text x="38" y="599" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">AUTHORED SUPPORT</text><text x="38" y="619" font-size="11" font-weight="550" fill="#222">Support conversations show pressure is felt</text><text x="38" y="646" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">WHAT WOULD WEAKEN THIS CONCERN</text><text x="38" y="666" font-size="11" font-weight="550" fill="#222">Matched cohorts show retained invitees do not fall</text><g data-kind="receipt-reported-pattern"><rect x="38" y="695" width="824" height="238" fill="#1F4FD806" stroke="#bbc3d5" stroke-width="1"/><text x="52" y="716" font-size="8" font-weight="800" letter-spacing="0.65" fill="#0A6C94">APPLICABLE REPORTED PATTERN · NON-CAUSAL CONTEXT</text><text x="52" y="740" font-size="8" font-weight="800" letter-spacing="0.55" fill="#667">PROXY READING</text><text x="52" y="758" font-size="10" font-weight="650" fill="#222">Invitation rate rose from 11% to 19%</text><text x="52" y="779" font-size="8" font-weight="800" letter-spacing="0.55" fill="#667">PROTECTED OUTCOME</text><text x="52" y="797" font-size="10" font-weight="650" fill="#222">Seven-day invitee retention fell from 42% to 35% · New members retain trust</text><text x="52" y="818" font-size="8" font-weight="800" letter-spacing="0.55" fill="#667">POPULATION · HORIZON</text><text x="52" y="836" font-size="10" font-weight="650" fill="#222">New solo members · First seven days</text><text x="52" y="857" font-size="8" font-weight="800" letter-spacing="0.55" fill="#667">COMPARATOR · SOURCE</text><text x="52" y="875" font-size="10" font-weight="650" fill="#222">Prior prompt · Lantern event readout</text><line x1="52" y1="896" x2="848" y2="896" stroke="#bbc3d5" stroke-width="1"/><text x="52" y="914" font-size="10" font-weight="750" fill="#667">Context only — reported pattern does not establish causality.</text></g><l