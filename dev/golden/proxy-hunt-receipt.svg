<svg xmlns="http://www.w3.org/2000/svg" width="900" height="983" viewBox="0 0 900 983" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-labelledby="proxy-hunt-receipt-name proxy-hunt-receipt-description"><title id="proxy-hunt-receipt-name">Habitat invite pressure — selected failure theory receipt</title><desc id="proxy-hunt-receipt-description">Scoped receipt for fatigue. Do not optimise Invitation rate alone: Repeated prompts pressure people into low-intent invitations. Carry Seven-day invitee retention as the paired measure. Causal limit: The mechanism is an authored hypothesis, not proof of causal effect.</desc><rect x="0" y="0" width="900" height="983" fill="#f0f2f8"/><text x="20" y="32" font-size="9" font-weight="800" letter-spacing="1.1" fill="#0A6C94">PROXY HUNT · REVIEW READY</text><text x="880" y="32" font-size="8" font-weight="750" text-anchor="end" fill="#667">AUTHORED DATE · 2026-08-13</text><text x="20" y="63" font-size="25" font-weight="700" fill="#222">Habitat invite pressure</text><text x="20" y="104" font-size="18" font-weight="750" fill="#222">Do not optimise Invitation rate alone: Repeated prompts pressure people into low-intent invitations. Carry Seven-day</text><text x="20" y="129" font-size="18" font-weight="750" fill="#222">invitee retention as the paired measure.</text><text x="20" y="160" font-size="10" font-weight="650" fill="#667">The mechanism is an authored hypothesis, not proof of causal effect. Mechanism remains a hypothesis.</text><g data-kind="target-and-measurement"><rect x="20" y="192" width="860" height="72" fill="#1F4FD806" stroke="#bbc3d5" stroke-width="1"/><text x="38" y="218" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">DESIRED OUTCOME</text><text x="38" y="239" font-size="11" font-weight="600" fill="#222">Groups retain after week one</text><text x="318.67" y="218" font-size="8" font-weight="800" letter-spacing="0.75" fill="#0A6C94">MEASURE UNDER PRESSURE</text><text x="318.67" y="239" font-size="11" font-weight="750" fill="#222">Invitation rate</text><text x="599.33" y="218" font-size="8" font-weight="800" letter-spacing="0.75" fill="#667">ACTION UNDER REVIEW</text><text x="599.33" y="239" font-size="11" font-weight="600" fill="#222">Prompt every active member</text></g><g data-kind="selected-theory-receipt" data-theory-id="fatigue"><rect x="20" y="282" width="860" height="677" fill="#f0f1f1" stroke="#b33" stroke-width="1.5"/><rect x="20" y="282" width="4" height="677" fill="#b33"/><text x="38" y="308" font-size="9" font-weight="800" letter-spacing="0.9" fill="#b33">FAILURE THEORY RECEIPT · SCOPED</text><text x="38" y="336" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">FAILURE THEORY</text><text x="38" y="356" font-size="11" font-weight="550" fill="#222">Repeated prompts pressure people into low-intent invitations</text><text x="38" y="383" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">HARMED OUTCOME</text><text x="38" y="403" font-size="11" font-weight="550" fill="#222">New members retain trust</text><text x="38" y="430" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">PAIRED GUARDRAIL</text><text x="38" y="450" font-size="11" font-weight="700" fill="#222">Seven-day invitee retention</text><text x="38" y="477" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">BASIS</text><text x="38" y="497" font-size="11" font-weight="550" fill="#222">Reasoned mechanism</text><text x="38" y="524" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">AUTHORED SUPPORT</text><text x="38" y="544" font-size="11" font-weight="550" fill="#222">Support conversations show pressure is felt</text><text x="38" y="571" font-size="8" font-weight="800" letter-spacing="0.65" fill="#667">WHAT WOULD WEAKEN THIS CONCERN</text><text x="38" y="591" font-size="11" font-weight="550" fill="#222">Matched cohorts show retained invitees do not fall</text><g data-kind="receipt-reported-pattern"><rect x="38" y="620" width="824" height="238" fill="#1F4FD806" stroke="#bbc3d5" stroke-width="1"/><text x="52" y="641" font-size="8" font-weight="800" letter-spacing="0.65" fill="#0A6C94">APPLICABLE REPORTED PATTERN · NON-CAUSAL CONTEXT</text><text x="52" y="665" font-size="8" font-weight="800" letter-spacing="0.55" fill="#667">PROXY READING</text><text x="52" y="683" font-size="10" font-weight="650" fill="#222">Invitation rate rose from 11% to 19%</text><text x="52" y="704" font-size="8" font-weight="800" letter-spacing="0.55" fill="#667">PROTECTED OUTCOME</text><text x="52" y="722" font-size="10" font-weight="650" fill="#222">Seven-day invitee retention fell from 42% to 35% · New members retain trust</text><text x="52" y="743" font-size="8" font-weight="800" letter-spacing="0.55" fill="#667">POPULATION · HORIZON</text><text x="52" y="761" font-size="10" font-weight="650" fill="#222">New solo members · First seven days</text><text x="52" y="782" font-size="8" font-weight="800" letter-spacing="0.55" fill="#667">COMPARATOR · SOURCE</text><text x="52" y="800" font-size="10" font-weight="650" fill="#222">Prior prompt · Habitat event readout</text><line x1="52" y1="821" x2="848" y2="821" stroke="#bbc3d5" stroke-width="1"/><text x="52" y="839" font-size="10" font-weight="750" fill="#667">Context only — reported pattern does not establish causality.</text></g><line x1="38" y1="870" x2="862" y2="870" stroke="#bbc3d5" stroke-width="1"/><text x="38" y="886" font-size="8" font-weight="800" letter-spacing="0.7" fill="#b33">CAUSAL LIMIT</text><text x="38" y="904" font-size="10" font-weight="700" fill="#667">The mechanism is an authored hypothesis, not proof of causal effect.</text><text x="38" y="919" font-size="10" font-weight="700" fill="#667">Reported pattern does not establish causality.</text><text x="38" y="934" font-size="10" font-weight="700" fill="#667">Mechanism remains a hypothesis.</text></g></svg>