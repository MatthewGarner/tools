<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reframe a problem through different lenses, compare the next moves, and choose a small test. A private, locally saved thinking workbench.">
  <meta name="theme-color" content="#faf8f2">
  <script src="../shared/appearance.js?v=0.20.0"></script><title>Reframing Workbench · Thinking Lab</title>
  <link rel="stylesheet" href="../shared/base.css?v=0.20.0">
  <link rel="stylesheet" href="../shared/ancestry.css?v=0.20.0">
  <link rel="stylesheet" href="./style.css?v=0.20.0">
<link rel="stylesheet" href="../shared/design.css?v=0.20.0"></head>
<body>
  <main id="workbench" class="workbench">
    <noscript>This workbench needs JavaScript to edit and save your frames. Your writing is stored only in this browser.</noscript>
  </main>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="lens-dialog" aria-labelledby="lens-title"></dialog>
  <dialog id="sessions-dialog" aria-labelledby="sessions-title"></dialog>
  <dialog id="export-dialog" aria-labelledby="export-title"></dialog>
  <dialog id="inquiry-dialog" aria-labelledby="inquiry-title"></dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <script type="module" src="./app.js?v=0.20.0"></script>
</body>
</html>
